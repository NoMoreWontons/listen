<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>listen</title>
<!-- Added to the iPad home screen, these launch it fullscreen with a status bar
     that matches the paper ground instead of Safari's default white. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="listen">
<meta name="theme-color" content="#EFEBE0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* ---- ground & chassis ---- */
    --paper:      #EFEBE0; /* page ground, warm cardboard */
    --paper-deep: #E4DECF; /* recessed wells, rack gaps */
    --card:       #FBF9F3; /* module face */
    --chassis:    #2B2A28; /* transport console, brushed graphite */
    --chassis-hi: #444038; /* console bevel highlight */
    --chassis-lo: #1E1C1A; /* scope well */
    --lcd:        #F3EEE2; /* cream readout window */

    /* ---- ink ---- */
    --ink:        #23221F;
    --ink-soft:   #7B7466;
    --ink-on-panel: #C9C4B6;

    /* ---- lamps ---- */
    --rec:        #D9432F; /* transport REC lamp */
    --live:       #3FA78C; /* signal LED, "hearing audio" */
    --amber:      #DE9A32; /* transcribing */
    --amber-ink:  #3A2C00;

    /* ---- engraved rules: one rail token, not six ad-hoc greys ---- */
    --rail:       #D8D1BF;
    --rail-soft:  #E7E1D2;
    --rail-dark:  #C4BBA4;

    --radius-panel: 16px;
    --radius-card: 10px;
    --radius-ctl: 7px;

    --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    --font-body: "Instrument Sans", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

    /* ---- type scale: 6 steps, no in-between guessing ---- */
    --t-xs:   0.6875rem;
    --t-sm:   0.8125rem;
    --t-base: 0.9375rem;
    --t-lg:   1.125rem;
    --t-xl:   1.5rem;
    --t-2xl:  2.25rem;

    /* ---- spacing: 4px base ---- */
    --s1: .25rem; --s2: .5rem; --s3: .75rem; --s4: 1rem;
    --s5: 1.5rem; --s6: 2rem; --s7: 3rem;
  }

  * { box-sizing: border-box; }

  body {
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    max-width: 1240px;
    margin: 0 auto;
    padding: var(--s6) 1.25rem var(--s7);
    font-size: var(--t-base);
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  /* focus discipline: one visible ring everywhere, no per-widget exceptions */
  :focus-visible {
    outline: 2px solid var(--live);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .main {
    display: grid;
    /* minmax(0,…) — plain fr lets long merge-panel/select text widen the column, jittering layout */
    grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
    gap: var(--s5);
    align-items: start;
    margin-top: var(--s5);
  }
  @media (max-width: 860px) {
    .main { grid-template-columns: 1fr; }
  }

  /* ---- brand ---- */
  .brand {
    display: flex;
    align-items: baseline;
    gap: var(--s3);
    padding-bottom: var(--s3);
    margin-bottom: var(--s5);
    border-bottom: 1px solid var(--rail);
  }
  .brand h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: var(--t-2xl);
    letter-spacing: -0.035em;
    line-height: 1;
    margin: 0;
  }
  .tagline {
    margin: 0;
    font-size: var(--t-xs);
    font-family: var(--font-mono);
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: .1em;
  }

  /* ---- engraved unit label: text, then a hairline rail to the panel edge ---- */
  .deck-label {
    display: flex;
    align-items: center;
    gap: var(--s2);
    font-family: var(--font-display);
    font-size: var(--t-xs);
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: var(--s3);
  }
  .deck-label::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--rail);
  }
  .deck .deck-label { color: var(--ink-on-panel); opacity: .8; }
  .deck .deck-label::after { background: var(--chassis-hi); }

  /* ---- transport console ---- */
  .deck {
    background:
      linear-gradient(180deg, #322F2C 0%, var(--chassis) 62%, #262421 100%);
    border-radius: var(--radius-panel);
    padding: 1.25rem 1.4rem 1.4rem;
    box-shadow:
      inset 0 1px 0 var(--chassis-hi),
      inset 0 -1px 0 #171514,
      0 12px 28px -16px rgba(0,0,0,.6);
  }

  .deck-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 10rem auto;
    align-items: start;
    gap: var(--s5);
  }
  @media (max-width: 860px) {
    .deck-row { grid-template-columns: 1fr; gap: var(--s4); }
  }

  .deck-group.signal { min-width: 0; }

  #controls { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; }

  /* universal click/hover feedback for every button; specific rules below still win on color */
  button { transition: transform .1s ease, filter .15s ease; }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px) scale(.985); filter: brightness(.95); }
  @media (prefers-reduced-motion: reduce) { button:active { transform: none; } }

  button#btn, button#pauseBtn, button#meetBtn, button.upload-btn {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--t-sm);
    letter-spacing: .01em;
    padding: .6rem 1.15rem;
    border-radius: 999px;
    border: 1px solid #57524B;
    background: linear-gradient(180deg, #3E3A34, #322F2A);
    color: var(--ink-on-panel);
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 2px 5px rgba(0,0,0,.35);
    transition: transform .12s ease, background .2s ease, box-shadow .2s ease;
  }
  button#btn { padding-left: 1.3rem; padding-right: 1.3rem; }
  button#btn:hover, button#pauseBtn:hover, button#meetBtn:hover, button.upload-btn:hover { background: linear-gradient(180deg, #4A453E, #3B3731); }
  button#btn:active, button#pauseBtn:active, button#meetBtn:active, button.upload-btn:active { transform: translateY(1px); }
  .deck-group.upload { display: flex; flex-wrap: wrap; gap: var(--s2); }
  .deck-group.upload > .deck-label { flex: 1 1 100%; margin-bottom: var(--s1); }

  button.tx-pause {
    font-family: var(--font-display);
    font-size: var(--t-xs);
    font-weight: 600;
    padding: .15rem .65rem;
    margin-left: var(--s2);
    border-radius: 999px;
    border: 1px solid var(--rail-dark);
    background: var(--card);
    color: var(--ink-soft);
    cursor: pointer;
  }
  button.tx-pause.tx-paused { background: #F7E8CF; border-color: #C69A3E; color: #7A5510; }

  select#micSelect {
    font-family: var(--font-mono);
    font-size: var(--t-xs);
    max-width: 11rem;
    background: #38352F;
    color: var(--ink-on-panel);
    border: 1px solid #57524B;
    border-radius: var(--radius-ctl);
    padding: .4rem .5rem;
  }

  button#btn.recording {
    background: var(--rec);
    color: #fff;
    border-color: #EE5B45;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(217,67,47,.55); }
    50%      { box-shadow: 0 0 0 7px rgba(217,67,47,0); }
  }
  @media (prefers-reduced-motion: reduce) {
    button#btn.recording { animation: none; }
  }

  /* tape counter — recessed LCD window, always legible, tabular digits */
  .timer {
    display: none;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    font-size: var(--t-base);
    background: var(--lcd);
    color: var(--ink);
    padding: .4rem .7rem;
    border-radius: var(--radius-ctl);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.06);
    letter-spacing: .04em;
  }
  .timer.on { display: inline-block; }

  .mic {
    display: none;
    font-size: var(--t-xs);
    font-family: var(--font-mono);
    color: var(--ink-on-panel);
    word-break: break-word;
  }
  .mic.on { display: inline; }

  /* oscilloscope well — visible at rest so the deck is never dead air */
  /* slim well at rest, full scope while the meters run */
  #wave {
    display: block;
    width: 100%;
    height: 26px;
    margin-top: var(--s4);
    transition: height .25s ease;
    border-radius: 8px;
    background:
      linear-gradient(var(--chassis-hi) 1px, transparent 1px) 0 50% / 100% 18px,
      linear-gradient(90deg, rgba(68,64,56,.55) 1px, transparent 1px) 0 0 / 40px 100%,
      var(--chassis-lo);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.5);
  }
  #wave.on { height: 84px; }
  @media (prefers-reduced-motion: reduce) { #wave { transition: none; } }
  .rack-foot { margin: var(--s3) 0 0; font-size: var(--t-sm); color: var(--ink-soft); }

  /* ---- sessions column ---- */
  .sessions > .deck-label { margin-bottom: var(--s3); }

  a.obs { color: inherit; text-decoration: underline dotted; text-underline-offset: 2px; }
  a.obs:hover { text-decoration: underline; }

  /* ---- rack: the side column is one chassis, not five floating cards ---- */
  .side {
    display: grid;
    gap: 1px;                      /* the gap IS the rail between rack units */
    align-content: start;
    background: var(--rail);
    border: 1px solid var(--rail-dark);
    border-radius: var(--radius-card);
    overflow: hidden;
  }
  .folders {
    background: var(--card);
    border: 0;
    border-radius: 0;
    padding: var(--s4) 1.1rem 1.1rem;
    /* grid items default to min-width:auto, so one wide row (a long "Unit / Topic")
       stretches the whole rail past .side, which clips it. Let them shrink instead. */
    min-width: 0;
  }
  .side > .folders:first-child { padding-top: 1.1rem; }

  /* ---- merge panel (units/topics) ---- */
  .merge-level { display: flex; gap: var(--s1); margin: 0 0 var(--s2); flex-wrap: wrap; }

  /* one pill recipe, shared by every small toggle/action button in the rack */
  .merge-level button,
  .pill-btn,
  .merge-sugg button,
  .merge-manual button,
  #weakSpots button,
  #graphCard button {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--t-xs);
    letter-spacing: .01em;
    padding: .32rem .8rem;
    border: 1px solid var(--rail-dark);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    white-space: nowrap;
  }
  .merge-level button, .pill-btn { color: var(--ink-soft); }
  .merge-level button:hover,
  .pill-btn:hover,
  .merge-sugg button:hover,
  .merge-manual button:hover,
  #weakSpots button:hover,
  #graphCard button:hover { background: var(--paper-deep); }
  .merge-level button.on, .pill-btn.on {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--lcd);
  }
  /* the deck's own pill sits on graphite, so it inverts */
  .deck .pill-btn {
    background: #38352F;
    border-color: #57524B;
    color: var(--ink-on-panel);
  }
  .deck .pill-btn:hover { background: #45403A; }
  .deck .pill-btn.on { background: var(--live); border-color: var(--live); color: #10221D; }

  .merge-hint { margin: 0 0 var(--s1); font-size: var(--t-sm); color: var(--ink-soft); }
  .merge-sugg {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: var(--s1) var(--s3); padding: var(--s2) 0;
    border-bottom: 1px solid var(--rail-soft); font-size: var(--t-sm);
  }
  /* each name in its own chip: the pair wraps onto several lines in this narrow
     rail, and without a box you cannot see where one topic ends and the next
     begins. max-width lets a long chip wrap INSIDE its border rather than
     becoming an unshrinkable block that stretches the rail again. */
  .merge-sugg em {
    font-style: normal; font-weight: 600;
    display: inline-block; max-width: 100%; overflow-wrap: anywhere;
    padding: .12rem .42rem;
    border: 1px solid var(--rail-dark); border-radius: var(--radius-ctl);
    background: var(--paper-deep);
  }
  /* "Unit / Topic -> Unit / Topic" is far wider than this rail, and the panel clips
     rather than scrolls -- give the names their own row and let them wrap. */
  .merge-sugg > span:first-child { flex: 1 1 100%; min-width: 0; overflow-wrap: anywhere; }
  .merge-cls {
    font-family: var(--font-mono); font-size: var(--t-xs);
    color: var(--ink-soft); margin-left: .45rem;
  }
  .merge-actions { display: flex; gap: var(--s1); flex-wrap: wrap; }
  #weakSpots .gs-note { margin: 0 0 var(--s2); display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }

  /* control cluster shared by Practice / Ask / Review / manual merge */
  .merge-manual {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: var(--s2); margin-top: var(--s2); font-size: var(--t-sm);
  }
  .merge-into { color: var(--ink-soft); }
  .merge-manual select,
  .merge-manual input[type="text"] {
    flex: 1; min-width: 8rem; max-width: 13rem;
    font-family: inherit; font-size: var(--t-sm);
    padding: .35rem .45rem;
    border: 1px solid var(--rail-dark); border-radius: var(--radius-ctl);
    background: var(--paper); color: var(--ink);
  }
  .merge-manual select:hover, .merge-manual input[type="text"]:hover { border-color: var(--ink-soft); }
  /* Topic keys run "Unit / Topic" under a class-named optgroup -- past the 13rem
     cap the shared cluster wants, and a native select clips instead of wrapping.
     In the merge panel the two selects get a row each at full panel width. */
  #merge .merge-manual { flex-direction: column; align-items: stretch; }
  #merge .merge-manual select { max-width: none; width: 100%; }
  #merge .merge-manual button { align-self: flex-start; }

  /* ---- practice quizzes ---- */
  .pq-row {
    display: flex; justify-content: space-between; gap: var(--s2);
    padding: .4rem .35rem; margin: 0 -.35rem;
    border-bottom: 1px solid var(--rail-soft);
    font-size: var(--t-sm); cursor: pointer; border-radius: 5px;
  }
  .pq-row:hover { background: var(--paper-deep); }
  .pq-score {
    font-family: var(--font-mono); font-size: var(--t-xs);
    font-variant-numeric: tabular-nums; color: var(--ink-soft);
  }
  /* semester divider in the past-quiz list — quieter than .deck-label, which
     labels the whole card and would compete with it at the same weight */
  .pq-sem {
    font-family: var(--font-display); font-size: var(--t-xs); font-weight: 700;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft);
    opacity: .75; margin: var(--s3) 0 .25rem;
  }
  .pq-sem:first-child { margin-top: var(--s2); }
  .quiz {
    background: var(--card); border: 1px solid var(--rail);
    border-radius: var(--radius-card); padding: 1.1rem 1.2rem; margin: 0 0 var(--s3);
  }
  .quiz .q { margin: var(--s3) 0; }
  .quiz .q p { margin: 0 0 var(--s1); font-weight: 600; }
  .quiz label { display: block; font-size: var(--t-sm); padding: .18rem 0; cursor: pointer; }
  .quiz textarea {
    width: 100%; padding: .4rem .55rem; font-size: var(--t-sm); font-family: inherit;
    border: 1px solid var(--rail-dark); border-radius: var(--radius-ctl);
    background: var(--paper); resize: vertical;
  }
  .quiz .verdict { font-size: var(--t-sm); margin: var(--s1) 0 0; }
  .quiz .verdict.good { color: #1F6A57; }
  .quiz .verdict.bad { color: #8F2323; }
  .quiz .quiz-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); }
  .quiz .quiz-head button { border: none; background: none; cursor: pointer; color: var(--ink-soft); font-size: var(--t-sm); }

  /* primary action — the one amber control per surface */
  .quiz button.submit,
  .split-actions button,
  .labels button {
    font-family: var(--font-display); font-weight: 600; font-size: var(--t-sm);
    padding: .38rem .9rem; border: 0; border-radius: var(--radius-ctl);
    cursor: pointer; background: var(--amber); color: var(--amber-ink);
  }
  /* one amber call-to-action per surface; everything alongside it stays quiet */
  .split-actions button:last-child,
  .labels button.ocr-btn { background: var(--paper-deep); color: var(--ink); }
  .pending-page {
    border: 1px solid var(--rail-soft); border-radius: 4px;
    padding: .45rem .55rem; margin: .4rem 0;
  }
  .pending-page b { font-size: .85rem; }
  .pending-page textarea {
    width: 100%; margin: .35rem 0; font: inherit; font-size: .82rem;
    background: var(--paper-deep); color: var(--ink);
    border: 1px solid var(--rail-soft); border-radius: 3px; padding: .3rem;
    resize: vertical; box-sizing: border-box;
  }
  .pending-row { display: flex; gap: .35rem; align-items: center; }
  .pending-row select { flex: 1; min-width: 0; font-size: .8rem; }
  .split-actions button:disabled { opacity: .55; cursor: default; }

  /* ---- graph color settings ---- */
  #graphCard summary { cursor: pointer; list-style: none; }
  #graphCard summary::-webkit-details-marker { display: none; }
  #graphCard .deck-label { margin: 0; }
  #graphCard details[open] .deck-label { margin-bottom: var(--s3); }
  #gsLevel {
    margin: var(--s3) 0 var(--s1); font-size: var(--t-sm); padding: .35rem .45rem;
    border: 1px solid var(--rail-dark); border-radius: var(--radius-ctl);
    background: var(--paper); color: var(--ink); font-family: inherit;
  }
  .gs-row { display: flex; align-items: center; gap: var(--s3); margin: var(--s1) 0; font-size: var(--t-sm); }
  .gs-row label { flex: 0 0 9.5rem; color: var(--ink-soft); }
  .gs-row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--ink-soft); }
  .gs-val {
    flex: 0 0 3.2rem; text-align: right;
    font-family: var(--font-mono); font-size: var(--t-xs);
    font-variant-numeric: tabular-nums; color: var(--ink-soft);
  }
  .gs-note { margin: 0 0 var(--s2); font-size: var(--t-xs); color: var(--ink-soft); line-height: 1.45; }

  /* ---- folder tree ---- */
  .folders details { margin: .1rem 0; }
  .folders details details { margin-left: 1rem; padding-left: .55rem; border-left: 1px solid var(--rail-soft); }
  .folders summary {
    cursor: pointer;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: var(--t-sm);
    padding: .28rem .35rem;
    border-radius: 5px;
    margin: 0;
    list-style: none;
  }
  .folders summary::-webkit-details-marker { display: none; }
  .folders summary:hover { background: var(--paper-deep); }

  /* engraved caret instead of an OS-dependent emoji folder */
  #tree summary::before,
  #merge summary::before {
    content: "";
    display: inline-block;
    width: 0; height: 0;
    margin-right: .5rem;
    vertical-align: 1px;
    border-left: 5px solid var(--ink-soft);
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    transition: transform .15s ease;
  }
  #tree details[open] > summary::before,
  #merge details[open] > summary::before { transform: rotate(90deg); }
  @media (prefers-reduced-motion: reduce) {
    #tree summary::before, #merge summary::before { transition: none; }
  }

  .folders .topic {
    margin-left: 1.5rem;
    padding: .22rem .35rem;
    font-size: var(--t-sm);
    border-radius: 5px;
  }
  .folders .topic:hover { background: var(--paper-deep); }
  .folders .topic::before {
    content: "";
    display: inline-block;
    width: 3px; height: 3px;
    margin: 0 .55rem 0 .15rem;
    vertical-align: 3px;
    border-radius: 50%;
    background: var(--ink-soft);
  }
  .folders .topic .when {
    font-family: var(--font-mono);
    font-size: var(--t-xs);
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    margin-left: .4rem;
  }
  .topic .pick { margin-right: .35rem; opacity: .35; accent-color: var(--ink); }
  .topic:hover .pick, .pick:checked { opacity: 1; }
  .tree-del {
    float: right; border: none; background: none; cursor: pointer;
    color: var(--ink-soft); font-size: var(--t-sm); padding: 0 .3rem; opacity: 0;
  }
  .folders summary:hover .tree-del, .folders .topic:hover .tree-del { opacity: 1; }
  .tree-del:hover { color: #A8331F; }
  .tree-del:focus-visible { opacity: 1; }
  .folders summary.drag-over, .folders .topic.drag-over {
    background: #F7E8CF; outline: 2px dashed #93670F; outline-offset: -2px;
  }
  .folders summary.sel, .folders .topic.sel {
    background: var(--paper-deep); outline: 1px solid var(--ink-soft); outline-offset: -1px;
  }
  .tree-menu {
    position: fixed;
    z-index: 1000;
    min-width: 150px;
    background: var(--card);
    border: 1px solid var(--rail-dark);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.18);
    padding: var(--s1) 0;
    font-size: var(--t-sm);
  }
  .tree-menu-item {
    padding: .35rem .9rem;
    cursor: pointer;
    color: var(--ink);
  }

  .split-seg { padding: var(--s2) 0; border-bottom: 1px solid var(--rail-soft); font-size: var(--t-sm); }

       !important because .main/.brand set display at higher specificity. */

<script>
// useMaxWidth:false — the default stretches every diagram to the container, which

<body>
<header class="brand">
  <h1>listen</h1>
  <p class="tagline">lecture &amp; meeting transcriber</p>
</header>

<section class="deck" aria-label="Recording console">
  <div class="deck-row">
    <div class="deck-group">
      <span class="deck-label">Transport</span>
      <div id="controls">
        <button id="btn">&#9679; Record</button>
        <button id="pauseBtn" hidden>&#10074;&#10074; Pause</button>
        <button id="meetBtn" title="Record an online class or meeting: records the shared audio only, never your mic. Chromium/Opera — turn on &quot;Also share system audio&quot; in the picker, and pick Your Entire Screen for a desktop app like Teams.">&#9788; Meeting</button>
        <span id="timer" class="timer">0:00</span>
        <select id="micSelect" title="Microphone"></select>
        <button id="liveTx" class="pill-btn" title="Show rolling transcript while recording — uses noticeably more battery (extra Whisper decodes)">Live transcript</button>
      </div>
    </div>
    <div class="deck-group signal">
      <span class="deck-label">Signal</span>
      <span id="mic" class="mic"></span>
    </div>
    <div class="deck-group upload">
      <span class="deck-label">Upload</span>
      <button id="uploadBtn" class="upload-btn" title="Upload audio or video (Zoom/Teams recordings included), PDF, PowerPoint, or Word (or drop it anywhere on the page)">&#8686; Audio / Docs</button>
      <input type="file" id="fileInput" accept=".mp3,.m4a,.wav,.webm,.ogg,.mp4,.mov,.pdf,.pptx,.docx" hidden>
      <button id="hwBtn" class="upload-btn" title="Upload homework (PDF or photo) — auto-filed, then link it to a due date">&#8686; Homework</button>
      <input type="file" id="hwInput" accept=".pdf,image/*" hidden>
      <button id="ytBtn" class="upload-btn" title="Add a YouTube video — save the link as a reference note, or transcribe it like a lecture">&#9654; YouTube</button>
      <button id="pendingBtn" class="upload-btn" title="Handwritten page with no lecture yet — typed up now, attached to a recording later">&#9998; iPad Page</button>
      <input type="file" id="pendingInput" accept="image/*,.pdf" hidden>
    </div>
  </div>
  <canvas id="wave" aria-hidden="true"></canvas>
</section>

<div id="sheetArea"></div>

<div class="main">
  <section class="sessions">
    <span class="deck-label">Recent</span>
    <div id="quizArea"></div>
    <div id="reviewArea"></div>
    <div id="list"></div>
  </section>
  <div class="side">
    <section class="folders">
      <span class="deck-label">Library</span>
      <div id="pickBar" hidden></div>
      <div id="tree"></div>
    </section>
    <section class="folders" id="pending" hidden></section>
    <section class="folders" id="merge" hidden></section>
    <section class="folders" id="practice">
      <span class="deck-label">Practice</span>
      <div class="merge-manual">
        <select id="pSem" onchange="pScope()" title="Filter by semester"></select>
        <select id="pClass" onchange="pScope()"></select>
        <select id="pUnit"></select>
        <select id="pKind">
          <option value="quiz">Quiz — 10 q</option>
          <option value="test">Test — 20 q</option>
        </select>
        <select id="pFormat">
          <option value="mcq">MCQ</option>
          <option value="frq">FRQ — write on paper</option>
        </select>
        <button onclick="genQuiz(this)">Generate</button>
      </div>
      <div id="weakSpots"></div>
      <div id="pastQuizzes"></div>
    </section>
    <section class="folders" id="review">
      <span class="deck-label">Review</span>
      <div class="merge-manual">
        <select id="rSem" onchange="rScope()" title="Filter by semester"></select>
        <select id="rClass" onchange="rScope()"></select>
        <select id="rUnit"></select>
        <button onclick="genCards(this)">Make cards</button>
        <button onclick="dlCheat()">Cheat sheet</button>
      </div>
      <div id="dueCount"></div>
      <p class="rack-foot"><a class="obs" href="/cards_due.ics">Flashcard due dates (.ics)</a></p>
    </section>
    <section class="folders" id="ask">
      <span class="deck-label">Ask my notes</span>
      <div class="merge-manual">
        <input type="text" id="askQ" placeholder="Ask a question about your notes…">
        <button onclick="askNotes(this)">Ask</button>
      </div>
      <div id="askAnswer"></div>
    </section>
    <section class="folders" id="graphCard">
      <details>
        <summary class="deck-label">Graph colors</summary>
        <select id="gsLevel" onchange="gsShowLevel()">
          <option value="class">Class hubs</option>
          <option value="unit">Unit hubs</option>
          <option value="topic">Topic notes</option>
        </select>
        <div class="gs-sliders">
          <div class="gs-row" data-level="class"><label>Fade min (cool hues)</label><input type="range" id="gs_class_drop_min" min="0" max="100" oninput="gsVal(this)"><span class="gs-val"></span></div>
          <div class="gs-row" data-level="class"><label>Fade max (warm hues)</label><input type="range" id="gs_class_drop_max" min="0" max="100" oninput="gsVal(this)"><span class="gs-val"></span></div>
          <div class="gs-row" data-level="unit"><label>Fade min (cool hues)</label><input type="range" id="gs_unit_drop_min" min="0" max="100" oninput="gsVal(this)"><span class="gs-val"></span></div>
          <div class="gs-row" data-level="unit"><label>Fade max (warm hues)</label><input type="range" id="gs_unit_drop_max" min="0" max="100" oninput="gsVal(this)"><span class="gs-val"></span></div>
          <div class="gs-row" data-level="unit"><label>Hue shift &plusmn;</label><input type="range" id="gs_unit_hue_shift" min="0" max="100" oninput="gsVal(this)"><span class="gs-val"></span></div>
          <div class="gs-row" data-level="topic"><label>Fade min (cool hues)</label><input type="range" id="gs_topic_drop_min" min="0" max="100" oninput="gsVal(this)"><span class="gs-val"></span></div>
          <div class="gs-row" data-level="topic"><label>Fade max (warm hues)</label><input type="range" id="gs_topic_drop_max" min="0" max="100" oninput="gsVal(this)"><span class="gs-val"></span></div>
          <div class="gs-row" data-level="topic"><label>Hue shift &plusmn;</label><input type="range" id="gs_topic_hue_shift" min="0" max="100" oninput="gsVal(this)"><span class="gs-val"></span></div>
        </div>
        <p class="gs-note">Semester hubs stay white. Fades scale with hue warmth — warm colors calm down more.</p>
        <button onclick="saveGraphSettings(this)">Save &amp; recolor</button>
      </details>
    </section>
  </div>
</div>

<script>
let mr, rid, recording = false;
let audioCtx, analyser, rafId, timerId, startTime, waveBuf;
let openAssignments = [];
let vaultTree = {};  // {semester: [class, ...]} from the vault; classes with no recordings yet
let retentionDays = 7;  // overwritten by /app_settings; used only in the "audio expired" message
const btn = document.getElementById('btn');
const meetBtn = document.getElementById('meetBtn');
const timer = document.getElementById('timer');
const mic = document.getElementById('mic');
const micSelect = document.getElementById('micSelect');
const canvas = document.getElementById('wave');
const ctx = canvas.getContext('2d');

// navigator.mediaDevices only exists in a secure context — https, or http on
// localhost. Over plain http to an IP it's undefined, and touching it here used
// to throw at the top of the script: every handler below went unbound, so
// Record, Upload and the whole page went dead rather than just recording.
// The iPad now reaches this over https (tailscale serve, docs/ipad-workflow.md),
// but the guard stays: a plain-http bind is one .env edit away.
const canRecord = !!navigator.mediaDevices?.getUserMedia;
// Tab audio capture is Chromium-only, and needs the same secure origin.
const canShare = canRecord && !!navigator.mediaDevices?.getDisplayMedia;
const INSECURE_MSG = 'Recording needs a secure origin (https, or http on localhost). '
  + 'This page is plain http, so the browser hides the microphone. '
  + 'Record on the machine running the server (set LISTEN_HOST=127.0.0.1 in .env, open '
  + 'http://127.0.0.1:8000), or serve it over https with a cert the iPad trusts — see '
  + 'docs/ipad-workflow.md. Upload and everything else still work here.';

async function loadMics() {
  if (!canRecord) return;
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'audioinput');
  const saved = localStorage.getItem('micId');
  micSelect.innerHTML = devices.map((d, i) =>
    `<option value="${d.deviceId}">${esc(d.label || 'Microphone ' + (i + 1))}</option>`).join('');
  if (saved && devices.some(d => d.deviceId === saved)) micSelect.value = saved;
}
micSelect.onchange = () => localStorage.setItem('micId', micSelect.value);
if (canRecord) {
  navigator.mediaDevices.addEventListener('devicechange', loadMics);
  loadMics();
} else {
  btn.title = micSelect.title = INSECURE_MSG;
  micSelect.hidden = true;
}
if (!canShare) {
  meetBtn.hidden = true;  // Firefox/Safari: no tab audio to mix, so no meeting mode
}

function fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

// stamps live notes with elapsed recording time so they line up with the lecture later.
// setTimeout lets the native Enter/newline land first, then we insert the prefix on the new line.
function stampNote(e, ta) {
  if (e.key !== 'Enter' || !recording || !startTime) return;
  const stamp = `[${fmt(Math.floor((Date.now() - startTime) / 1000))}] `;
  setTimeout(() => {
    const pos = ta.selectionStart;
    ta.setRangeText(stamp, pos, pos, 'end');
    ta.dispatchEvent(new Event('input'));  // setRangeText doesn't fire input -- keep the draft save wired
  }, 0);
}

function drawWave() {
  rafId = requestAnimationFrame(drawWave);
  analyser.getByteTimeDomainData(waveBuf);
  const buf = waveBuf;
  // peak deviation from the 128 silence baseline → is the mic actually hearing anything?
  let peak = 0;
  for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
  if (peak > 3) { mic.textContent = '● receiving audio'; mic.style.color = '#3FA78C'; }
  else { mic.textContent = '● no input'; mic.style.color = '#D9432F'; }
  // Size the backing store to the displayed size so the line isn't stretched -- but
  // only when it actually changed. Reading clientWidth forces a style+layout flush and
  // writing .width reallocates the backing store, so doing both unconditionally was 60
  // forced reflows a second fighting whatever else held the main thread. A 0 read (the
  // well not laid out yet) used to make slice 0 and stack every point at x=0, which
  // looks exactly like a frozen waveform.
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  if (canvas.width !== w) canvas.width = w;
  if (canvas.height !== h) canvas.height = h;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#DE9A32';
  ctx.beginPath();
  const slice = canvas.width / buf.length;
  for (let i = 0; i < buf.length; i++) {
    const y = (buf[i] / 128) * canvas.height / 2;
    const x = i * slice;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
}

function startMeters(stream) {
  audioCtx = new AudioContext();
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  waveBuf = new Uint8Array(analyser.fftSize);  // allocated once, not 60 times a second
  audioCtx.createMediaStreamSource(stream).connect(analyser);
  canvas.classList.add('on');
  mic.classList.add('on');
  drawWave();
  startTime = Date.now();
  timer.textContent = '0:00';
  timer.classList.add('on');
  timerId = setInterval(() => {
    if (mr && mr.state === 'paused') return; // hold the clock while paused
    timer.textContent = fmt(Math.floor((Date.now() - startTime) / 1000));
  }, 1000);
}

// A share with "Also share system audio" left off still hands over an audio
// track -- it just never carries sound. On 2026-09-16 that cost a 76-minute
// Teams lecture: the waveform moved (the mic was in the mix, picking up the
// room) so the capture looked live while the meeting half was silence. The mic
// is out of meeting mode now, and this says so out loud while the class is
// still running.
const SILENT_PEAK = 2;  // out of 128 -- under this a track is digital silence

function peakLevel(buf) {  // loudest deviation from silence in one frame
  let p = 0;
  for (let i = 0; i < buf.length; i++) p = Math.max(p, Math.abs(buf[i] - 128));
  return p;
}

function watchShareAudio(seconds = 45) {
  let peak = 0;
  const started = Date.now();
  const id = setInterval(() => {
    if (!recording) return clearInterval(id);
    analyser.getByteTimeDomainData(waveBuf);
    peak = Math.max(peak, peakLevel(waveBuf));
    if (Date.now() - started < seconds * 1000) return;
    clearInterval(id);
    if (peak < SILENT_PEAK) {
      alert('No sound has reached this recording in its first ' + seconds + ' seconds.\n\n'
        + 'The share is silent -- "Also share system audio" was almost certainly left off '
        + 'in the picker. Stop, share again with it on, and restart the recording.');
    }
  }, 1000);
}

function stopMeters() {
  cancelAnimationFrame(rafId);
  clearInterval(timerId);
  canvas.classList.remove('on');
  // the scope well is always on screen now, so wipe the last frame instead of hiding it
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  timer.classList.remove('on');
  mic.classList.remove('on');
  if (audioCtx) audioCtx.close();
}

function micAudio() {
  return micSelect.value
    ? { deviceId: { exact: micSelect.value }, autoGainControl: true, noiseSuppression: true }
    : { autoGainControl: true, noiseSuppression: true };
}

// Shared by both start buttons. `stream` is what MediaRecorder writes; `extra`
// carries source tracks that aren't in it -- in meeting mode the recorded stream
// holds only the share's audio track, so stopping it would leave the capture's
// video track live and Chrome's "sharing this tab" bar up after the recording ended.
async function beginRec(stream, extra = []) {
  rid = (await (await fetch('/start', { method: 'POST' })).json()).id;
  mr = new MediaRecorder(stream, { mimeType: 'audio/webm' });
  mr.ondataavailable = e => { if (e.data.size) fetch('/chunk/' + rid, { method: 'POST', body: e.data }); };
  mr.onstop = () => {
    fetch('/stop/' + rid, { method: 'POST' });
    [...stream.getTracks(), ...extra].forEach(t => t.stop());
    refresh();
  };
  mr.start(10000); // 10s chunks → survives a tab crash
  startMeters(stream);
  recording = true;
  btn.textContent = '■ Stop';
  btn.classList.add('recording');
  pauseBtn.hidden = false;
  pauseBtn.textContent = '❙❙ Pause';
  meetBtn.hidden = true; // one recording at a time -- Stop lives on #btn for both
}

function stopRec() {
  if (mr.state === 'paused') mr.resume(); // stop while paused loses the tail otherwise
  mr.stop();
  recording = false;
  btn.textContent = '● Record';
  btn.classList.remove('recording');
  pauseBtn.hidden = true;
  meetBtn.hidden = !canShare;
  stopMeters();
}

btn.onclick = async () => {
  if (recording) { stopRec(); return; }
  if (!canRecord) { alert(INSECURE_MSG); return; }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: micAudio() });
  } catch (e) {
    alert('Mic access failed: ' + e.name + ' — ' + e.message + '\nAllow the microphone for 127.0.0.1 and try again.');
    return;
  }
  loadMics(); // labels are blank until permission is granted once
  beginRec(stream);
};

// Meeting mode. A plain mic recording of a Teams/Zoom call keeps only your own
// half: everyone else arrives as speaker output, which echoCancellation exists
// to remove, and headphones drop them entirely. So record the shared audio
// itself -- and ONLY that. Mixing the mic in used to mean a silent share still
// drew a moving waveform off room noise, which reads as "the meeting is coming
// through" right up until you read the transcript. Chrome only offers the audio
// checkbox when video is requested too, so we ask for video and never read it.
meetBtn.onclick = async () => {
  let disp;
  try {
    disp = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
  } catch (e) {
    return; // picker dismissed -- not worth an alert
  }
  if (!disp.getAudioTracks().length) {
    disp.getTracks().forEach(t => t.stop());
    alert('That share carries no audio, so the recording would be silent.\n\n'
      + 'Share again and turn ON "Also share system audio" in the picker.\n'
      + 'A meeting running in a desktop app (Teams, Zoom) is only captured by '
      + '"Your Entire Screen" with that toggle on -- a tab share carries only the sound of that one tab.');
    return;
  }
  // Chrome ends the captured audio when the video track ends ("Stop sharing"),
  // so stop the recording there instead of quietly finishing the meeting on
  // silence -- that failure looks fine until you read the transcript.
  disp.getVideoTracks()[0].onended = () => { if (recording) stopRec(); };
  await beginRec(new MediaStream(disp.getAudioTracks()), disp.getTracks());
  watchShareAudio();
};

const pauseBtn = document.getElementById('pauseBtn');
let pausedAt = 0;
pauseBtn.onclick = () => {
  if (mr.state === 'recording') {
    mr.pause(); // native MediaRecorder pause — paused audio never enters the file
    pausedAt = Date.now();
    pauseBtn.textContent = '▶ Resume';
    timer.classList.remove('on');
  } else if (mr.state === 'paused') {
    mr.resume();
    startTime += Date.now() - pausedAt; // timer skips the paused stretch
    pauseBtn.textContent = '❙❙ Pause';
    timer.classList.add('on');
  }
};

function esc(s) { return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }
// summaries/key points are markdown with $...$ math; render instead of <pre>-dumping.
// esc first so any raw HTML from the model stays inert, then marked turns md syntax into tags.
// The one exception is a raw <svg> block -- a figure the model drew (boxplot, vector
// diagram, conic) that Obsidian renders natively. It is parked as escaped source in a
// <pre class="svgsrc"> and swapped for a sanitized node in drawDiagrams, so every other
// byte still goes through esc() and nothing else can inject HTML.
function md(s) {
  if (!window.marked) return `<pre>${esc(s || '')}</pre>`;
  const html = (s || '').split(/(<svg[\s\S]*?<\/svg>)/i)
    .map((part, i) => i % 2 ? `<pre class="svgsrc">${esc(part)}</pre>` : marked.parse(esc(part)))
    .join('');
  return `<div class="md">${html}</div>`;
}
// call after innerHTML that may contain md(); no-op offline (CDN unreachable)
function typeset(el) {
  if (window.renderMathInElement) renderMathInElement(el, {
    delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }],
    throwOnError: false,
  });
  drawDiagrams(el);  // after katex, which skips <code> — so the source is still there
}
// Allowlists, not denylists: an element or attribute the model invents is dropped
// because it is absent here, so there is no threat to have enumerated first.
const SVG_TAGS = new Set(['svg', 'g', 'line', 'rect', 'circle', 'ellipse', 'path',
  'polyline', 'polygon', 'text', 'tspan', 'title']);
const SVG_ATTRS = new Set(['viewBox', 'width', 'height', 'x', 'y', 'dx', 'dy',
  'x1', 'y1', 'x2', 'y2', 'cx', 'cy', 'r', 'rx', 'ry', 'd', 'points', 'transform',
  'fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'stroke-linecap',
  'stroke-linejoin', 'fill-opacity', 'stroke-opacity', 'opacity', 'text-anchor',
  'dominant-baseline', 'font-size', 'font-family', 'font-weight', 'font-style',
  'letter-spacing', 'preserveAspectRatio', 'class']);
// No style=, no href/xlink:href, no url() anywhere: that rules out <use>, <image>,
// external fetches and CSS-loaded resources without naming any of them.
function cleanSvg(src) {
  const root = new DOMParser().parseFromString(src, 'image/svg+xml').documentElement;
  if (root.nodeName !== 'svg') return null;  // parsererror, or not an svg at all
  const scrub = el => {
    for (const a of [...el.attributes]) {
      if (!SVG_ATTRS.has(a.name) || /url\s*\(/i.test(a.value)) el.removeAttributeNode(a);
    }
    for (const kid of [...el.children]) {
      if (SVG_TAGS.has(kid.nodeName)) scrub(kid); else kid.remove();
    }
  };
  scrub(root);
  return root;
}
let diagramN = 0;
// marked leaves a ```mermaid fence as <code class="language-mermaid">; swap each
// for its rendered svg. md() escapes before marked, and marked escapes code text
// again, so the source comes back one entity layer deep — decode it before parsing.
async function drawDiagrams(el) {
  // figures first -- they need no CDN, so they still draw when mermaid is unreachable
  for (const pre of el.querySelectorAll('pre.svgsrc')) {
    const svg = cleanSvg(pre.textContent);  // escaped once by md(), decoded once by the DOM
    if (!svg) continue;                     // malformed: leave the source visible
    const box = document.createElement('div');
    box.className = 'figure';
    box.appendChild(svg);
    pre.replaceWith(box);
  }
  if (!window.mermaid) return;
  for (const code of el.querySelectorAll('code.language-mermaid')) {
    const src = new DOMParser().parseFromString(code.textContent, 'text/html')
      .documentElement.textContent;
    try {
      const { svg } = await mermaid.render('mmd' + (++diagramN), src);
      const box = document.createElement('div');
      box.className = 'mermaid';
      box.innerHTML = svg;
      (code.closest('pre') || code).replaceWith(box);
      // In the two-column cheat-sheet layout a diagram shrinks to fit its
      // column. Past ~1.5x the column that's too small to read, so those break
      // out across both columns instead; the rest stay inline and keep it dense.
      const natural = box.querySelector('svg')?.getBBox().width || 0;
      if (natural > box.clientWidth * 1.5) box.classList.add('wide');
    } catch (e) {
      // bad syntax from the model — leave the source visible, it still reads
      document.getElementById('dmmd' + diagramN)?.remove();  // mermaid's error stub
    }
  }
}
function escAttr(s) { return (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

const STAGE_LABEL = { loading_model: 'loading model', transcribing: 'transcribing', summarizing: 'summarizing' };

// fills the audio player + timestamped transcript into a done row's <details>, once,
// the first time it's opened (data-loaded guard -- the 5s refresh() wipe re-renders
// the <details> empty, so this gets called again next open via the ontoggle wiring
// and once more per poll while open, from refresh()'s post-render pass below).
// Same shape of waste as the summaries below: refresh() wipes #list every 5s and hands
// back a blank slot, so an open audio box used to refetch /segments and rebuild its
// <audio> element on every tick. Segments never change once transcribed, so keep the
// filled node and re-adopt it after the wipe -- that also carries playback position
// across a refresh instead of resetting it.
const audioBoxCache = new Map();  // rid -> the filled .audio-slot node
async function loadAudioBox(details, rid) {
  const slot = details.querySelector('.audio-slot');
  if (!details.open || !slot || slot.dataset.loaded) return;
  const cached = audioBoxCache.get(rid);
  if (cached) { slot.replaceWith(cached); return; }
  slot.dataset.loaded = '1';
  audioBoxCache.set(rid, slot);
  let segs;
  try {
    const res = await fetch(`/segments/${rid}`);
    if (!res.ok) throw new Error(res.status);
    segs = await res.json();
  } catch {   // un-mark, or this row's audio box stays blank until a page reload
    slot.dataset.loaded = '';
    audioBoxCache.delete(rid);
    return;
  }
  const segHtml = segs.map(s => `<span class="seg" data-s="${s.s}">[${fmt(Math.floor(s.s))}] ${esc(s.t)}</span> `).join('');
  slot.innerHTML = `<audio controls preload="none" src="/audio/${rid}"></audio><div class="live-tx">${segHtml}</div>`;
  const audio = slot.querySelector('audio');
  audio.onerror = () => { audio.outerHTML = `<p class="lbl-hint">audio expired (kept ${retentionDays} days)</p>`; };
  slot.querySelectorAll('.seg').forEach(el => el.onclick = () => {
    const a = slot.querySelector('audio');
    if (a) { a.currentTime = +el.dataset.s; a.play(); }
  });
}

// Same lazy-load + re-adopt dance as loadAudioBox, for the plain transcript:
// it used to ride along on /recordings, which meant the 5s poll pulled 2 MB of
// lecture text out of Supabase forever to fill a <details> nobody had opened.
const transcriptCache = new Map();  // rid -> the filled .tx-slot node
async function loadTranscript(details, rid) {
  const slot = details.querySelector('.tx-slot');
  if (!details.open || !slot || slot.dataset.loaded) return;
  const cached = transcriptCache.get(rid);
  if (cached) { slot.replaceWith(cached); return; }
  slot.dataset.loaded = '1';
  transcriptCache.set(rid, slot);
  let text = '';
  try {
    const res = await fetch(`/transcript/${rid}`);
    if (!res.ok) throw new Error(res.status);
    text = (await res.json()).transcript || '';
  } catch { slot.dataset.loaded = ''; transcriptCache.delete(rid); slot.innerHTML = '<em>transcript unavailable</em>'; return; }
  slot.innerHTML = text ? `<pre></pre>` : '<p><em>No speech detected.</em></p>';
  if (text) slot.querySelector('pre').textContent = text;
}

function labelEditor(r) {
  const live = r.status !== 'done';
  const filed = !!r.obsidian_uri;
  const hint = live
    ? '<span class="lbl-hint">set now — files to Obsidian when transcription finishes; Claude fills blanks</span>'
    : '';
  const editor = `<div class="labels" data-rid="${r.id}">
    <input class="lbl-sem"   list="dl-sem"   placeholder="semester" value="${escAttr(r.semester)}">
    <input class="lbl-class" list="dl-class" placeholder="class" value="${escAttr(r.class)}" onfocus="scopeDL(this,'class')">
    <input class="lbl-unit"  list="dl-unit"  placeholder="unit"  value="${escAttr(r.unit)}" onfocus="scopeDL(this,'unit')">
    <input class="lbl-topic" list="dl-topic" placeholder="topic" value="${escAttr(r.topic)}" onfocus="scopeDL(this,'topic')">
    <textarea class="lbl-notes" rows="2" oninput="localStorage.setItem('notes-draft-${r.id}', this.value)"
      onblur="if (localStorage.getItem('notes-draft-${r.id}') !== null) saveLabels('${r.id}')"
      ${r.status === 'recording' ? 'onkeydown="stampNote(event, this)"' : ''}
      placeholder="your notes — woven into the AI summary on save">${esc(localStorage.getItem('notes-draft-' + r.id) ?? r.notes ?? '')}</textarea>
    <button onclick="saveLabels('${r.id}')">${filed ? 'Update note' : live ? 'Save labels' : 'Save to Obsidian'}</button>
    ${live ? `<button class="ocr-btn" data-sel=".lbl-notes" onclick="ocrNotes('${r.id}', this)" title="Photo, PDF, PowerPoint, Word, or text file — transcribed into the notes box, woven into the summary when the lecture is analyzed">&#128247; Add notes from file</button>` : ''}
    ${live ? '' : `
    <textarea class="lbl-addendum" rows="2" oninput="localStorage.setItem('addendum-draft-${r.id}', this.value)"
      placeholder="correction / addition — appended to the note as-is, no re-summary">${esc(localStorage.getItem('addendum-draft-' + r.id) ?? '')}</textarea>
    <button onclick="saveAddendum('${r.id}')">Append to note</button>
    <button class="ocr-btn" data-sel=".lbl-addendum" onclick="ocrNotes('${r.id}', this, '.lbl-addendum')" title="Photo, PDF, PowerPoint, Word, or text file — read and appended to the note straight away">&#128247; Add pages to note</button>`}
    ${hint}
  </div>`;
  // filed already -> tuck the editor away; relabelling moves the note
  return filed ? `<details class="labels-done" data-k="${r.id}-labels"><summary>Edit labels / note</summary>${editor}</details>` : editor;
}

function splitCard(r) {
  const segs = r.pending_segments || [];
  // No proposal in hand means the fetch hasn't landed or the server and this page
  // disagree about where pending_segments comes from (it left the poll in 4942296).
  // Offering "Keep as one" against an empty list asks the user to fold a split they
  // cannot see -- and that fold is irreversible. Wait for the segments instead.
  if (!segs.length)
    return `<div class="split-card" data-rid="${r.id}">
      <p class="lbl-hint">This recording covers multiple topics — loading the proposed split…</p>
    </div>`;
  const preview = s => esc((s.summary || '').slice(0, 120)) + ((s.summary || '').length > 120 ? '…' : '');
  return `<div class="split-card" data-rid="${r.id}">
    <p class="lbl-hint">This recording covers multiple topics — file as separate notes?</p>
    ${segs.map(s => `<div class="split-seg">
      <b>${esc(s.topic || '')}</b> — ${esc(s.class || '')} / ${esc(s.unit || '')}
      <p>${preview(s)}</p>
    </div>`).join('')}
    <div class="split-actions">
      <button onclick="doSplit('${r.id}', true, this)">Split into ${segs.length} notes</button>
      <button onclick="doSplit('${r.id}', false, this)">Keep as one</button>
    </div>
  </div>`;
}

async function doSplit(rid, approve, btn) {
  for (const b of btn.parentElement.querySelectorAll('button')) b.disabled = true;
  const resp = await (await fetch(`/split/${rid}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ approve }),
  })).json();
  if (resp.error) alert(resp.error);
  document.activeElement?.blur(); // clicked button holds focus in #list — guard would skip the re-render
  refresh();
}

// --- pages staged before their lecture exists -------------------------------
// Notes taken on the iPad reach the laptop long before the audio does, so a page
// can be typed up and proofread now and attached to a recording that doesn't
// exist yet. Nothing here touches #list, so the 5s refresh leaves it alone.
let pendingPages = [];

async function stagePage(f) {
  if (!f) return;
  const btn = document.getElementById('pendingBtn');
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'uploading…';
  try {
    const resp = await postFile(`/pending?filename=${encodeURIComponent(f.name)}`, f,
      pct => btn.textContent = pct === null ? 'reading…' : `uploading ${pct}%`,
      () => btn.textContent = 'reading…');
    if (resp.error) { alert(resp.error); return; }
    await refresh();
  } finally { btn.disabled = false; btn.textContent = old; }
}

async function savePendingText(name, text) {
  await fetch(`/pending/${encodeURIComponent(name)}`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }) });
}

async function attachPending(name) {
  const box = document.querySelector(`#pending [data-page="${CSS.escape(name)}"]`);
  const rid = box.querySelector('select').value;
  if (!rid) { alert('Pick a lecture first.'); return; }
  await savePendingText(name, box.querySelector('textarea').value);  // corrections first
  const btn = box.querySelector('.attach-btn');
  btn.disabled = true; btn.textContent = 'filing…';
  const resp = await (await fetch(`/pending/${encodeURIComponent(name)}/attach`,
    { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rid }) })).json();
  if (resp.error) alert(resp.error);
  document.activeElement.blur();   // or refresh() skips the rebuild
  refresh();
}

async function dropPending(name) {
  if (!confirm('Discard this page? The image and its text are deleted.')) return;
  await fetch(`/pending/${encodeURIComponent(name)}`, { method: 'DELETE' });
  document.activeElement.blur();
  refresh();
}

function renderPending(rows) {
  const panel = document.getElementById('pending');
  // same trap as renderMerge: never rebuild while the user is mid-proofread
  if (document.activeElement && panel.contains(document.activeElement)) return;
  fetch('/pending').then(r => r.json()).then(pages => {
    if (document.activeElement && panel.contains(document.activeElement)) return;
    pendingPages = Array.isArray(pages) ? pages : [];
    panel.hidden = pendingPages.length === 0;
    if (panel.hidden) return;
    const filed = rows.filter(r => r.status === 'done');
    const nearest = up => {   // default to the lecture closest in time to the upload
      const t = Date.parse(up) || Date.now();
      let best = '', gap = Infinity;
      for (const r of filed) {
        const d = Math.abs(Date.parse(r.created_at) - t);
        if (d < gap) { gap = d; best = r.id; }
      }
      return best;
    };
    panel.innerHTML = `<span class="deck-label">Pages waiting (${pendingPages.length})</span>`
      + pendingPages.map(p => {
        const sel = nearest(p.uploaded_at);
        const opts = filed.length
          ? filed.map(r => `<option value="${escAttr(r.id)}"${r.id === sel ? ' selected' : ''}>`
              + `${esc((r.created_at || '').slice(0, 10))} — ${esc(r.topic || r.title || 'Lecture')}</option>`).join('')
          : '<option value="">no lectures yet — upload the audio first</option>';
        return `<div class="pending-page" data-page="${escAttr(p.name)}">
          <b>${esc(p.filename)}</b>
          <span class="src">${esc((p.uploaded_at || '').slice(0, 16).replace('T', ' '))}</span>
          <button class="del" title="Discard this page" onclick="dropPending('${escAttr(p.name)}')">&#10005;</button>
          <textarea rows="5" spellcheck="true"
            onblur="savePendingText('${escAttr(p.name)}', this.value)">${esc(p.text || '')}</textarea>
          <div class="pending-row">
            <select ${filed.length ? '' : 'disabled'}>${opts}</select>
            <button class="attach-btn pill-btn" ${filed.length ? '' : 'disabled'}
              onclick="attachPending('${escAttr(p.name)}')">Attach</button>
          </div>
        </div>`;
      }).join('');
  }).catch(() => {});
}

async function uploadFile(f, forceKind, btn) {
  if (!f) return;
  let kind = forceKind || 'audio';
  if (!forceKind && /\.(pdf|pptx|docx)$/i.test(f.name)) {
    kind = confirm('Is this a syllabus?\nOK = syllabus (extract due dates to calendar)\nCancel = lecture material') ? 'syllabus' : 'pdf';
  }
  // a dropped file has no button of its own -- borrow the one it stands in for
  btn = btn || document.getElementById('uploadBtn');
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = 'uploading\u2026';
  let resp;
  try {
    resp = await postFile(`/upload?kind=${kind}&filename=${encodeURIComponent(f.name)}`, f,
      pct => btn.textContent = pct === null ? 'starting\u2026' : `uploading ${pct}%`,
      () => btn.textContent = 'starting\u2026');
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
  if (resp.error) { alert(resp.error); return; }
  // focus may still sit inside #list (same trap as deleteRec) — blur or refresh() skips
  document.activeElement.blur();
  refresh();
}

// Tab closed / browser died mid-lecture leaves the row stuck in "recording" with
// no client left to call /stop. The 10s chunk uploads mean the audio up to that
// point is already on disk, so treat the crash as the stop — same thing the
// server's startup resume_stuck() sweep does, minus the restart.
async function finishStuck(id) {
  await fetch(`/stop/${id}`, { method: 'POST' });
  document.activeElement.blur();
  refresh();
}

async function deleteRec(rid) {
  if (!confirm('Delete this recording, its audio, and its Obsidian note? This cannot be undone.')) return;
  await fetch(`/recordings/${rid}`, { method: 'DELETE' });
  labelsStale = true;   // a vanished row looks like a paged-out one to hydrateLabels
  // the clicked ✕ still holds focus inside #list, which makes refresh() skip
  document.activeElement.blur();
  refresh();
}

// POST one file with upload progress. fetch() reports none, so a phone photo or a
// 30-page PDF sat on 'transcribing...' through the whole upload with no sign it was
// moving -- and the wait after that is Claude reading it, which is a different wait.
// onProgress(pct|null) during the upload, onDone() the moment the bytes are all sent.
function postFile(url, file, onProgress, onDone) {
  return new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    // xhr.upload.onload fires when the bytes are sent, not when the server is
    // done -- the wait after that is Claude reading the page while whisper has
    // the CPU, and with no timeout a request that simply hangs left the button
    // on 'reading...' forever. Generous, because a 30-page PDF really is slow;
    // the point is only that it ends.
    xhr.timeout = 15 * 60 * 1000;
    xhr.upload.onprogress = e => onProgress(e.lengthComputable ? Math.round(e.loaded / e.total * 100) : null);
    xhr.upload.onload = () => onDone();   // bytes sent; the server is working now
    // Never reject: every caller wraps this in try/finally with no catch, so a
    // rejection used to unwind past them, reset the button to its idle label and
    // leave no trace -- on the iPad, where the server is busy transcribing and
    // Safari drops the request when the tab backgrounds, that is the common case
    // and it looked identical to a clean upload. An {error} always reaches the
    // callers' `if (resp.error) alert(...)`.
    xhr.onload = () => {
      let body = null;
      try { body = JSON.parse(xhr.responseText); } catch {}
      // FastAPI's default 500 is {"detail": "..."} -- valid JSON with no `error`
      // key, so status has to be checked or a crash reads as success and
      // `undefined` gets appended to the notes.
      if (xhr.status < 200 || xhr.status >= 300)
        resolve({ error: (body && (body.error || body.detail)) || `Upload failed — the server returned ${xhr.status}.` });
      else
        resolve(body || { error: `Upload failed — the server's reply could not be read (status ${xhr.status}).` });
    };
    xhr.onerror = () => resolve({ error: 'Upload failed — no reply from the server. Still on the same Wi-Fi / Tailscale?' });
    xhr.onabort = () => resolve({ error: 'Upload stopped before it finished — nothing was saved. Try again.' });
    xhr.ontimeout = () => resolve({ error: 'Upload timed out — nothing was saved. Try again.' });
    xhr.send(file);
  });
}

// >0 while an /ocr upload is in flight -- refresh() leaves #list alone until it
// drops back to 0, so the button reporting progress is still the one on screen.
let uploading = 0;

async function ocrNotes(rid, btn, sel = '.lbl-notes') {
  const picker = document.createElement('input');
  picker.type = 'file';
  picker.accept = 'image/*,.pdf,.pptx,.docx,.txt,.md';
  picker.onchange = async () => {
    const f = picker.files[0];
    if (!f) return;
    // Browsing Files takes seconds, and nothing gates the 5s tick until the
    // counter moves below -- so the button captured at render time is usually
    // already detached by now, and writing progress to it would show nothing.
    // Re-resolve against the live DOM first. (Bumping the counter before
    // picker.click() instead would leave it stuck at 1 on a cancelled picker,
    // freezing the list for the rest of the session.)
    btn = document.querySelector(`.labels[data-rid="${rid}"] .ocr-btn[data-sel="${sel}"]`) || btn;
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = 'uploading…';
    uploading++;
    let resp;
    try {
      resp = await postFile(`/ocr?filename=${encodeURIComponent(f.name)}&rid=${encodeURIComponent(rid)}`,
        f, pct => btn.textContent = pct === null ? 'reading…' : `uploading ${pct}%`,
        () => btn.textContent = 'reading…');
    } finally {
      uploading--;
      btn.disabled = false; btn.textContent = old;
    }
    if (resp.error) { alert(resp.error); return; }
    // the page itself is only kept for types Obsidian can embed -- say so, rather
    // than storing nothing and looking identical to a success
    if (!resp.attached) alert(`Read "${f.name}", but the file itself was not kept. Only PDF and image pages are embedded in the note.`);
    // the row can flip to split_pending or error mid-upload, and neither renders
    // a label editor; without this the assignment throws and the text is lost
    const ta = document.querySelector(`.labels[data-rid="${rid}"] ${sel}`);
    if (!ta) { alert('This recording changed while the file uploaded. Transcribed text:\n\n' + resp.text); return; }
    const key = sel === '.lbl-addendum' ? 'addendum-draft-' : 'notes-draft-';
    const merged = (ta.value.trim() ? ta.value.trimEnd() + '\n\n' : '') + resp.text;
    ta.value = merged;
    localStorage.setItem(key + rid, merged); // programmatic set skips oninput
    // A page added to a FINISHED recording is an addition, not a correction to
    // review: append it now rather than making the user hunt for a second button.
    // Verbatim, no Claude call -- the summary the lecture already earned stands.
    // ponytail: no undo in the UI; the source page is embedded beside the text,
    // so a misread transcription is visible and fixable in Obsidian.
    if (sel === '.lbl-addendum') { await saveAddendum(rid); return; }
    // the chip only appears once the card re-renders, and refresh() skips that
    // while focus sits in #list -- so blur, repaint, then take focus back. The
    // rebuilt textarea rehydrates from the draft we just stored.
    document.activeElement?.blur();
    await refresh();
    const live = document.querySelector(`.labels[data-rid="${rid}"] ${sel}`) || ta;
    live.focus(); // review before save; focus also pauses the 5s refresh wipe
  };
  picker.click();
}

async function saveLabels(rid) {
  const box = document.querySelector(`.labels[data-rid="${rid}"]`);
  const resp = await (await fetch(`/label/${rid}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      semester: box.querySelector('.lbl-sem').value,
      klass: box.querySelector('.lbl-class').value,
      unit:  box.querySelector('.lbl-unit').value,
      topic: box.querySelector('.lbl-topic').value,
      notes: box.querySelector('.lbl-notes').value,
    }),
  })).json();
  if (resp.error) alert(resp.error);
  else localStorage.removeItem('notes-draft-' + rid); // server has it now
  summaryText.delete(rid);  // edited notes re-summarize the row: refetch it once
  refresh();
}

async function saveAddendum(rid) {
  const ta = document.querySelector(`.labels[data-rid="${rid}"] .lbl-addendum`);
  if (!ta.value.trim()) return;
  const resp = await (await fetch(`/addendum/${rid}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text: ta.value }),
  })).json();
  if (resp.error) { alert(resp.error); return; }
  localStorage.removeItem('addendum-draft-' + rid);
  document.activeElement?.blur(); // focused textarea would make refresh() skip the repaint
  refresh();
}

// homework card: pick which due date this upload fulfills (soonest first = default)
function hwLinker(r) {
  const opts = openAssignments.filter(a => !r.class || !a.klass || a.klass === r.class);
  if (!opts.length) return '';
  return `<div class="merge-manual"><span class="merge-into">fulfills</span>
    <select id="hw-${r.id}">${opts.map(a =>
      `<option value="${escAttr(a.id)}">${esc(a.title)} — due ${esc(a.due_on)}</option>`).join('')}</select>
    <button onclick="linkHw('${r.id}')">Mark submitted</button></div>`;
}

async function linkHw(rid) {
  const aid = document.getElementById('hw-' + rid).value;
  await fetch(`/assignments/${aid}/complete`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ recording_id: rid }),
  });
  document.activeElement?.blur(); // clicked button holds focus in #list — guard would skip re-render
  refresh();
}

function progressBar(r) {
  const label = r.paused ? 'paused' : STAGE_LABEL[r.stage] || r.stage || 'working';
  const known = r.progress !== null && r.progress !== undefined;
  const fill = known ? `<div class="bar-fill" style="width:${r.progress}%"></div>`
    : r.paused ? '<div class="bar-fill" style="width:0%"></div>'  // frozen, not pulsing
    : '<div class="bar-fill indeterminate"></div>';
  const pauseBtn = `<button class="tx-pause${r.paused ? ' tx-paused' : ''}" onclick="togglePause('${r.id}')" title="${r.paused ? 'Resume transcription' : 'Pause transcription to save battery — resumes exactly where it left off'}">${r.paused ? '&#9654; Resume' : '&#9208; Pause'}</button>`;
  return `<div class="progress"><div class="bar">${fill}</div><span class="progress-label">${esc(label)}${known ? ' — ' + r.progress + '%' : '…'}</span>${pauseBtn}</div>`;
}

// Summaries are the expensive half of a row: markdown with $math$, mermaid decision
// trees and inline SVG figures (app.py asks the model for all three). refresh() wipes
// #list every 5s, so every tick used to re-parse them and re-run katex plus a full
// mermaid layout for every finished lecture -- hundreds of ms of blocking main-thread
// work on a loop. That is what stalled the page and froze the waveform, and it fires
// hardest while recording, when live_transcript changes the markup every tick.
// So render each summary once into a detached node and re-adopt that same node after
// the wipe: innerHTML detaches it, the cache holds the only reference so it survives.
// Keyed on the summary text, not the id, so /resummarize still repaints.
const summaryCache = new Map();  // id -> { src, node }
function fillSummaries(rows) {
  for (const slot of document.querySelectorAll('#list .sum-slot')) {
    const id = slot.dataset.sum;
    const row = rows.find(r => r.id === id);
    if (!row) continue;
    let hit = summaryCache.get(id);
    if (!hit || hit.src !== row.summary) {
      const node = document.createElement('div');
      node.innerHTML = md(row.summary);
      hit = { src: row.summary, node };
      summaryCache.set(id, hit);
      slot.replaceWith(node);
      typeset(node);  // katex + mermaid, paid once per summary instead of every 5s
    } else {
      slot.replaceWith(hit.node);
    }
  }
  // a deleted recording's node would otherwise be held forever by the cache alone
  const live = new Set(rows.map(r => r.id));
  for (const id of summaryCache.keys()) if (!live.has(id)) summaryCache.delete(id);
  for (const id of audioBoxCache.keys()) if (!live.has(id)) audioBoxCache.delete(id);
  for (const id of transcriptCache.keys()) if (!live.has(id)) transcriptCache.delete(id);
}

// /recordings stopped carrying `summary` (267 kB across the table, re-sent on every
// 5s tick until Supabase cut the project off for exceeding its egress quota). Fetch
// each row's once and paste it back onto the row, so everything downstream --
// the card markup, fillSummaries, mergeSuggestions, renderTree -- is unchanged.
const summaryText = new Map();  // rid -> summary/error text, fetched once per row, in one batch
async function hydrateSummaries(rows) {
  const want = rows.filter(r => !summaryText.has(r.id)
                                && (r.status === 'done' || r.status === 'error')).map(r => r.id);
  if (want.length) try {
    const res = await fetch('/summaries', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(want),
    });
    if (!res.ok) throw new Error(res.status);  // don't cache a 500 body as "no summary"
    const got = await res.json();
    for (const id of want) summaryText.set(id, got[id] || '');
  } catch { /* leave them unfetched -- the next tick retries */ }
  for (const r of rows) r.summary = summaryText.get(r.id) || '';
  const live = new Set(rows.map(r => r.id));
  for (const id of summaryText.keys()) if (!live.has(id)) summaryText.delete(id);
}

// The poll carries a page of cards; the vault tree, merge panel, scope pickers and
// datalists need every recording's labels, which is the one payload that still grew
// with the library forever. So fetch those once and keep them, refetching only when
// a label or status actually moves -- which the page notices on its own below, so
// nothing has to remember to invalidate this by hand.
let labelRows = [];
let labelsStale = true;
const LABEL_KEYS = ['status', 'semester', 'class', 'unit', 'topic', 'obsidian_uri', 'title'];
async function hydrateLabels(rows) {
  if (labelsStale) {
    try {
      const l = await (await fetch('/labels')).json();
      if (Array.isArray(l)) { labelRows = l; labelsStale = false; }
    } catch { /* keep the stale copy and retry next tick -- better than a blank tree */ }
  }
  const byId = new Map(labelRows.map(r => [r.id, r]));
  // any drift between the page of live rows and what /labels last said means the
  // library moved (a recording filed, a relabel, a delete) -- refetch next tick.
  for (const r of rows) {
    const known = byId.get(r.id);
    if (!known || LABEL_KEYS.some(k => (known[k] || '') !== (r[k] || ''))) labelsStale = true;
    byId.set(r.id, r);   // the live row wins: it's this tick's truth
  }
  return [...byId.values()].sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
}

// split proposals left the poll too (8.6 kB of stale proposals on rows that resolved
// theirs long ago). Only a split_pending card renders one, and there is rarely one at all.
const splitSegs = new Map();   // rid -> proposed segments
async function hydrateSplits(rows) {
  for (const r of rows) {
    if (r.status !== 'split_pending') { splitSegs.delete(r.id); continue; }
    if (!splitSegs.has(r.id)) {
      try {
        const res = await fetch(`/pending_split/${r.id}`);
        if (!res.ok) throw new Error(res.status);
        splitSegs.set(r.id, (await res.json()).pending_segments || []);
      } catch { continue; }   // no entry cached, so the next tick tries again
    }
    r.pending_segments = splitSegs.get(r.id);
  }
}

let listLimit = 200;   // cards fetched per poll; "show older" raises it
function showOlder(btn) {
  listLimit += 400;
  btn.disabled = true;
  refresh();
}

async function refresh() {
  // ponytail: don't blow away a label field the user is mid-edit on the 5s tick
  if (document.activeElement && document.getElementById('list').contains(document.activeElement)) return;
  // don't yank a playing <audio> out from under the user: skip only the #list
  // rebuild while ANY of them plays — side panels below keep updating.
  // ponytail: progress bars inside #list freeze during playback; acceptable.
  const audioPlaying = [...document.querySelectorAll('#list audio')].some(a => !a.paused);
  const rows = await (await fetch(`/recordings?limit=${listLimit}`)).json();
  pollBusy = rows.some(r => r.status === 'recording' || r.status === 'transcribing');
  await hydrateSummaries(rows);
  await hydrateSplits(rows);
  // rows = the page of cards; allRows = the whole library, labels only, for the panels
  const allRows = await hydrateLabels(rows);
  // folders in the vault, so a semester scaffolded but not yet recorded into still shows up.
  // guarded like openAssignments below: a failed fetch (old server, no endpoint) must not blank the tree.
  try { vaultTree = await (await fetch('/vault_tree')).json() || {}; } catch { vaultTree = {}; }
  openAssignments = [];  // never let a failed fetch (e.g. migration not yet applied) be non-array — hwLinker.filter would throw and blank the list
  if (rows.some(r => r.source === 'homework' && r.status === 'done')) {
    try { const a = await (await fetch('/assignments_open')).json(); if (Array.isArray(a)) openAssignments = a; } catch {}
  }
  updateDatalists(allRows);
  const openK = new Set([...document.querySelectorAll('#list details[open]')].map(d => d.dataset.k).filter(Boolean));
  // uploading: iOS Safari never focuses a tapped <button>, so the activeElement
  // guard above does not hold on the iPad -- the rewrite detached the button
  // mid-upload and every progress write landed on a dead node.
  if (!audioPlaying && !uploading) document.getElementById('list').innerHTML = rows.map(r => `
    <div class="rec">
      <b>${esc(r.title || '')}</b> <span class="status" data-s="${r.status}">${r.status}</span>${r.obsidian_uri ? ` <a class="obs" href="${escAttr(r.obsidian_uri)}" title="Open note in Obsidian">&#8599; Obsidian</a>` : ''}${r.source && r.source !== 'local' ? ` <span class="src">via ${esc(r.source.replace('upload_audio', 'upload'))}</span>` : ''}${(r.attachments || []).length ? ` <span class="clip" title="${escAttr(r.attachments.join(', '))}">&#128206; ${r.attachments.length} page${r.attachments.length > 1 ? 's' : ''}</span>` : ''}<button class="del" title="Delete recording" onclick="deleteRec('${r.id}')">&#10005;</button>
      ${r.status === 'transcribing' ? progressBar(r) : ''}
      ${r.status === 'recording' && r.live_transcript ? `<div class="live-tx">${esc(r.live_transcript)}</div>` : ''}
      ${r.status === 'recording' && r.id !== rid ? `<p><button class="pill-btn" title="This tab isn't recording it — transcribe the audio saved so far" onclick="finishStuck('${r.id}')">Finish &amp; transcribe</button></p>` : ''}
      ${r.status === 'error' ? `<p class="error-msg">${esc(r.summary || 'Unknown error')}</p>` : ''}
      ${r.status === 'split_pending' ? splitCard(r) : r.status !== 'error' ? labelEditor(r) : ''}
      ${r.source === 'homework' && r.status === 'done' ? hwLinker(r) : ''}
      ${r.status === 'done' && r.summary ? `<h4>Summary</h4><div class="sum-slot" data-sum="${r.id}"></div>` : ''}
      ${r.source === 'syllabus' && r.status === 'done' ? `<p><a href="/assignments/${r.id}.ics">&#128197; Download due dates (.ics) — import into Google Calendar</a></p>` : ''}
      ${r.status === 'done' && (r.tokens_in || r.tokens_out) ? `<p class="tokens">${r.tokens_in || 0} in / ${r.tokens_out || 0} out tokens</p>` : ''}
      ${r.status === 'done' ? `<details class="audio-box" data-k="${r.id}-audio" ontoggle="loadAudioBox(this,'${r.id}')"><summary>&#9654; audio + timestamps</summary><div class="audio-slot"></div></details>` : ''}
      ${r.status === 'done' || r.status === 'error' || r.status === 'split_pending' ? `<details class="tx-box" data-k="${r.id}-tx" ontoggle="loadTranscript(this,'${r.id}')"><summary>Transcript</summary><div class="tx-slot"></div></details>` : ''}
    </div>`).join('');
  // a full page means there are probably older recordings behind it -- they're still
  // in the tree and the pickers (allRows), just not carried as cards on every tick.
  if (!audioPlaying && !uploading && rows.length >= listLimit)
    document.getElementById('list').insertAdjacentHTML('beforeend',
      `<p class="gs-note"><button class="pill-btn" onclick="showOlder(this)">Show older recordings (${allRows.length - rows.length} more)</button></p>`);
  for (const d of document.querySelectorAll('#list details[data-k]'))
    if (openK.has(d.dataset.k)) d.open = true;
  fillSummaries(rows);
  typeset(document.getElementById('list'));
  // details start closed by default -- ontoggle only fires on the open<->closed transitions
  // above, so re-opened boxes (openK) need an explicit kick to (re)fill their now-empty slot.
  document.querySelectorAll('#list details.audio-box[open]').forEach(d => loadAudioBox(d, d.dataset.k.replace('-audio', '')));
  document.querySelectorAll('#list details.tx-box[open]').forEach(d => loadTranscript(d, d.dataset.k.replace('-tx', '')));
  renderTree(allRows);
  renderPending(rows);      // staged uploads only, never older than this page
  renderMerge(allRows);
  renderPractice(allRows);
  renderReview(allRows);
}

// google-style suggestions while typing labels: native <datalist>, options = existing labels.
// Scoped to the row being edited -- units belong to a class, topics to a unit -- so
// filing a Calculus lecture doesn't offer every Physics unit in the vault. Rescoped on
// focus rather than at render time: refresh() bails out while focus is inside #list, so a
// render-time list would never see a class the user just typed into a blank row.
const DL = { semester: 'dl-sem', class: 'dl-class', unit: 'dl-unit', topic: 'dl-topic' };
const PARENTS = { semester: [], class: ['semester'], unit: ['semester', 'class'], topic: ['semester', 'class', 'unit'] };
let lastRows = [];        // rows from the last refresh, for scopeDL between refreshes
const norm = v => (v || '').trim().toLowerCase();

// Pure: the options for `field` given the row's already-filled parent fields. A blank
// parent doesn't filter; a filled one matches case-insensitively ("physics" vs "Physics"
// must not empty the unit list). An empty result is honest -- first unit in a new class.
function scopeVals(rows, field, sel, tree) {
  const ok = r => PARENTS[field].every(p => !norm(sel[p]) || norm(r[p]) === norm(sel[p]));
  const semKey = Object.keys(tree).find(s => norm(s) === norm(sel.semester));
  const fromVault = field === 'semester' ? Object.keys(tree)
    : field === 'class' ? (norm(sel.semester) ? (semKey ? tree[semKey] : []) : Object.values(tree).flat())
    : [];
  return [...new Set([...rows.filter(ok).map(r => r[field]), ...fromVault]
    .map(v => (v || '').trim()).filter(Boolean))].sort();
}

function fillDL(field, vals) {
  let dl = document.getElementById(DL[field]);
  if (!dl) { dl = document.createElement('datalist'); dl.id = DL[field]; document.body.appendChild(dl); }
  dl.innerHTML = vals.map(v => `<option value="${escAttr(v)}">`).join('');
}

function updateDatalists(rows) {
  lastRows = rows;
  for (const field of Object.keys(DL)) fillDL(field, scopeVals(rows, field, {}, vaultTree));
}

// onfocus on a label input: narrow its datalist to that row's semester/class/unit
function scopeDL(el, field) {
  const box = el.closest('.labels');
  const val = c => box?.querySelector('.' + c)?.value || '';
  fillDL(field, scopeVals(lastRows, field,
    { semester: val('lbl-sem'), class: val('lbl-class'), unit: val('lbl-unit') }, vaultTree));
}

// ---- tree drag-drop: drag a unit summary or topic div onto a sibling of the same kind
// to merge, or a topic onto another unit's summary to move it there (same class only).
// Both reuse doMerge/-> /merge_topics, which already handles the cross-unit case. dragItem/treeDragging are module-level
// since dataTransfer payloads are unreliable for same-page drags in some browsers.
let dragItem = null;      // {kind: 'unit'|'topic', k, name} of the node being dragged
let treeDragging = false; // sat true from dragstart to dragend — pauses renderTree mid-drag
function canDrop(drag, target) {
  if (!drag || !target || drag.k !== target.k) return false;
  // topic -> unit summary: move the topic into that unit (same class). drag.name is
  // "unit||topic", so compare the unit segment — comparing the whole name would let a
  // topic drop onto its own unit and post a no-op merge.
  if (drag.kind === 'topic' && target.kind === 'unit') return drag.name.split('||')[0] !== target.name;
  return drag.kind === target.kind && drag.name !== target.name;
}

// ---- tree multi-select + right-click study menu. Keys are "sem||cls||unit" (unit) or
// "sem||cls||unit||topic" (topic) — el.dataset.k + '||' + el.dataset.name builds them directly.
let treeSel = new Set();  // selected tree keys (sem||cls||unit[||topic]); may span classes
let menuEl = null;        // the open context menu, or null — also gates renderTree (like treeDragging)
let genBusy = false;      // true while a /study/generate request is in flight
function applyTreeSel() {
  const tree = document.getElementById('tree'); // not treeEl — renderTree calls this before treeEl's own const binding exists on first boot
  for (const el of tree.querySelectorAll('.sel')) el.classList.remove('sel');
  for (const el of tree.querySelectorAll('[data-kind]'))
    if (treeSel.has(el.dataset.k + '||' + el.dataset.name)) el.classList.add('sel');
}

// "en-M1-2_ The AI Revolution" -> [1, 2]: lecture files carry <unit>-<topic> in
// the name. It orders the course; it is never a label. Mirrors _split_ordinal in app.py.
const ORDINAL = /^\W*(?:[A-Za-z]{2,3}[-_ ])?(?:M(?:od(?:ule)?)?|U(?:nit)?|W(?:eek)?)?\s*(\d{1,2})[-._ ](\d{1,3})(?=[^0-9A-Za-z]|$)/i;
const LAST = 1e9;  // unnumbered sorts after everything numbered, then alphabetically
const ordOf = t => { const m = ORDINAL.exec(t || ''); return m ? [+m[1], +m[2]] : null; };
const unitOrd = recs => Math.min(LAST, ...recs.map(r => ordOf(r.title)?.[0] ?? LAST));

function renderTree(rows) {
  if (treeDragging || menuEl) return; // a rewrite here would yank the dragged node, or the right-clicked node, out from under the interaction
  // semester > class > unit > topics, from filed recordings only
  const tree = {};
  for (const r of rows) {
    if (r.status !== 'done' || !r.semester || !r.class || !r.unit) continue;
    (((tree[r.semester] ??= {})[r.class] ??= {})[r.unit] ??= []).push(r);
  }
  for (const [sem, classes] of Object.entries(vaultTree))
    for (const cls of classes) (tree[sem] ??= {})[cls] ??= {};  // empty = class node with no units yet
  const open = new Set([...document.querySelectorAll('#tree details[open]')].map(d => d.dataset.k));
  const det = (k, label, inner) =>
    `<details data-k="${escAttr(k)}"${open.has(k) ? ' open' : ''}><summary>${esc(label)}</summary>${inner}</details>`;

  const topicHtml = (rs, sem, cls, unit) => {
    // rs: all recordings sharing one topic (backend writes one combined note per topic) — or a single topicless row
    const r = rs.at(-1);  // latest (rs sorted by created_at); rows in a group share one obsidian_uri
    // drag/merge only wired for rows that actually carry a topic label
    const attrs = r.topic
      ? `draggable="true" data-kind="topic" data-k="${escAttr(sem + '||' + cls)}" data-name="${escAttr(unit + '||' + r.topic)}"`
      : '';
    const label = r.obsidian_uri
      ? `<a class="obs" href="${escAttr(r.obsidian_uri)}" title="Open note in Obsidian">${esc(r.topic || r.title || 'untitled')}</a>`
      : esc(r.topic || r.title || 'untitled');
    const del = rs.length > 1
      ? `<button class="tree-del" title="Delete all ${rs.length} recordings" data-topic-del data-rids="${rs.map(x => x.id).join(',')}">&#10005;</button>`
      : `<button class="tree-del" title="Delete recording" onclick="deleteRec('${r.id}')">&#10005;</button>`;
    // draggable="false" on the checkbox: it sits inside a draggable div, without this a checkbox
    // click starts a tree drag instead of toggling.
    const pick = r.topic
      ? `<input type="checkbox" class="pick" draggable="false" data-sem="${escAttr(sem)}" data-cls="${escAttr(cls)}" data-topic="${escAttr(r.topic)}">`
      : '';
    return `<div class="topic" data-rid="${escAttr(r.id)}" ${attrs}>${pick}${label}<span class="when">${rs.length > 1 ? '&times;' + rs.length + ' &middot; ' : ''}${(r.created_at || '').slice(0, 10)}</span>${del}</div>`;
  };

  const unitHtml = (sem, cls, unit, recs) => {
    recs.sort((a, b) => (ordOf(a.title)?.[1] ?? LAST) - (ordOf(b.title)?.[1] ?? LAST)
      || (a.created_at || '').localeCompare(b.created_at || ''));
    const byTopic = {}, groups = [];  // one group per distinct topic; topicless rows stay solo
    for (const r of recs) {
      if (r.topic && byTopic[r.topic]) byTopic[r.topic].push(r);
      else groups.push(r.topic ? (byTopic[r.topic] = [r]) : [r]);
    }
    const inner = groups.map(g => topicHtml(g, sem, cls, unit)).join('');
    const k = sem + '/' + cls + '/' + unit;
    return `<details data-k="${escAttr(k)}"${open.has(k) ? ' open' : ''}>`
      + `<summary draggable="true" data-kind="unit" data-k="${escAttr(sem + '||' + cls)}" data-name="${escAttr(unit)}">${esc(unit)}`
      + `<button class="tree-del" title="Delete unit" data-unit-del data-sem="${escAttr(sem)}" data-cls="${escAttr(cls)}" `
      + `data-unit="${escAttr(unit)}" data-count="${recs.length}">&#10005;</button></summary>${inner}</details>`;
  };

  const treeDiv = document.getElementById('tree');
  treeDiv.innerHTML = Object.keys(tree).sort().map(sem =>
    det(sem, sem, Object.keys(tree[sem]).sort().map(cls =>
      det(sem + '/' + cls, cls, Object.keys(tree[sem][cls])
        .sort((a, b) => unitOrd(tree[sem][cls][a]) - unitOrd(tree[sem][cls][b]) || a.localeCompare(b))
        .map(unit => unitHtml(sem, cls, unit, tree[sem][cls][unit])).join(''))
    ).join(''))
  ).join('');
  applyTreeSel();

  // survive the rewrite above: re-check boxes still picked, and drop pickedTopics entries whose
  // topic vanished (renamed/deleted elsewhere) so a stale name can't be submitted.
  const liveBoxes = [...treeDiv.querySelectorAll('.pick')];
  const liveKeys = new Set(liveBoxes.map(cb => cb.dataset.sem + '||' + cb.dataset.cls + '||' + cb.dataset.topic));
  for (const key of pickedTopics.keys()) if (!liveKeys.has(key)) pickedTopics.delete(key);
  for (const cb of liveBoxes)
    cb.checked = pickedTopics.has(cb.dataset.sem + '||' + cb.dataset.cls + '||' + cb.dataset.topic);
  renderPickBar();
}

// ---- multi-select topics -> practice material: key is "sem||cls||topic", values from one class
// only (enforced on check). Survives the 5s re-render via the block at the end of renderTree above.
const pickedTopics = new Map();
function renderPickBar() {
  const bar = document.getElementById('pickBar');
  if (!pickedTopics.size) { bar.hidden = true; bar.innerHTML = ''; return; }
  // mid-interaction guard: the 5s poll re-runs renderTree -> here; rebuilding while a
  // select is focused would snap its dropdown shut (same class of bug as the notes wipe)
  if (bar.contains(document.activeElement)) return;
  const prevKind = document.getElementById('pickKind')?.value;
  const prevFmt = document.getElementById('pickFmt')?.value;
  bar.hidden = false;
  bar.innerHTML = `<div class="merge-manual">
    <span>${pickedTopics.size} topic${pickedTopics.size > 1 ? 's' : ''}</span>
    <select id="pickKind">
      <option value="quiz">Quiz — 10 q</option>
      <option value="test">Test — 20 q</option>
    </select>
    <select id="pickFmt">
      <option value="mcq">MCQ</option>
      <option value="frq">FRQ — write on paper</option>
    </select>
    <button class="pill-btn" data-pick-create>Create</button>
    <button class="pill-btn" data-pick-clear>Clear</button>
  </div>`;
  if (prevKind) document.getElementById('pickKind').value = prevKind;
  if (prevFmt) document.getElementById('pickFmt').value = prevFmt;
}

function clearPicked() {
  pickedTopics.clear();
  for (const cb of document.getElementById('tree').querySelectorAll('.pick:checked')) cb.checked = false;
  renderPickBar(); // pickedTopics is empty now, so this hides #pickBar too
}

// delegated: #pickBar's innerHTML is rewritten by renderPickBar, so listeners live on the container.
document.getElementById('pickBar').addEventListener('click', e => {
  if (e.target.closest('[data-pick-clear]')) { clearPicked(); return; }
  const btn = e.target.closest('[data-pick-create]');
  if (btn) createFromPicked(btn);
});

async function createFromPicked(btn) {
  const first = pickedTopics.values().next().value; // one-class rule guarantees every entry shares sem/cls
  const body = {
    semester: first.sem,
    class: first.cls,
    kind: document.getElementById('pickKind').value,
    format: document.getElementById('pickFmt').value,
    topics: [...pickedTopics.values()].map(t => t.topic),
  };
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'generating…';
  try {
    const q = await (await fetch('/quiz/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })).json();
    if (q.error) { alert(q.error); return; }
    clearPicked();
    pastLoaded = 0;
    renderQuizForm(q);
    document.getElementById('quizArea').scrollIntoView({ behavior: 'smooth' });
  } finally { btn.disabled = false; btn.textContent = old; }
}

// delegated: #tree's innerHTML is rewritten every refresh, so listeners live on the container.
// apostrophes in unit/topic names ("Newton's Laws") break inline onclick — data attrs + delegation.
const treeEl = document.getElementById('tree');
treeEl.addEventListener('dragstart', e => {
  const el = e.target.closest('[data-kind]');
  if (!el) return;
  dragItem = { kind: el.dataset.kind, k: el.dataset.k, name: el.dataset.name };
  treeDragging = true;
});
treeEl.addEventListener('dragover', e => {
  const el = e.target.closest('[data-kind]');
  if (!el || !canDrop(dragItem, { kind: el.dataset.kind, k: el.dataset.k, name: el.dataset.name })) return;
  e.preventDefault(); // required to allow a drop
  el.classList.add('drag-over');
});
treeEl.addEventListener('dragleave', e => {
  const el = e.target.closest('[data-kind]');
  if (el) el.classList.remove('drag-over');
});
treeEl.addEventListener('drop', e => {
  const el = e.target.closest('[data-kind]');
  if (el) el.classList.remove('drag-over');
  const target = el && { kind: el.dataset.kind, k: el.dataset.k, name: el.dataset.name };
  if (!canDrop(dragItem, target)) return;
  e.preventDefault();
  e.stopPropagation(); // don't let the page-level file-drop handler also fire
  // topic dropped on a unit: keep the topic name, swap its unit — doMerge's topic branch
  // wants "unit||topic" on both sides, and a unit summary's name is just the unit.
  const to = dragItem.kind === 'topic' && target.kind === 'unit'
    ? target.name + '||' + dragItem.name.split('||')[1]
    : target.name;
  doMerge(dragItem.kind, dragItem.k, dragItem.name, to);
});
treeEl.addEventListener('dragend', () => {
  // fires on both a completed drop and a cancelled drag — always clear
  treeDragging = false;
  dragItem = null;
  for (const el of treeEl.querySelectorAll('.drag-over')) el.classList.remove('drag-over');
});
treeEl.addEventListener('change', e => {
  const cb = e.target.closest('.pick');
  if (!cb) return;
  const { sem, cls, topic } = cb.dataset;
  const key = sem + '||' + cls + '||' + topic;
  if (!cb.checked) { pickedTopics.delete(key); renderPickBar(); return; }
  const existing = pickedTopics.values().next().value; // one class rule: compare against any existing pick
  if (existing && (existing.sem !== sem || existing.cls !== cls)) {
    alert('pick topics from one class at a time');
    cb.checked = false;
    return;
  }
  pickedTopics.set(key, { sem, cls, topic });
  renderPickBar();
});
treeEl.addEventListener('click', async e => {
  if (e.ctrlKey || e.metaKey) {
    const el = e.target.closest('[data-kind]');
    if (!el) return;
    e.preventDefault(); // don't toggle the <details> or follow an obsidian link on ctrl-click
    const key = el.dataset.k + '||' + el.dataset.name;
    treeSel.has(key) ? treeSel.delete(key) : treeSel.add(key);
    applyTreeSel();
    return;
  }
  const t = e.target.closest('[data-topic-del]');
  if (t) {
    e.preventDefault();
    e.stopPropagation();
    return deleteTopic(t.dataset.rids.split(','));
  }
  const b = e.target.closest('[data-unit-del]');
  if (!b) return;
  e.preventDefault();
  e.stopPropagation(); // don't toggle the <details>
  const { sem, cls, unit, count } = b.dataset;
  if (!confirm(`Delete unit "${unit}" and its ${count} notes? Recordings, audio, and Obsidian notes are removed. This cannot be undone.`)) return;
  const resp = await (await fetch('/delete_unit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ semester: sem, class: cls, unit }),
  })).json();
  if (!resp.ok) alert(resp.error || 'delete failed');
  document.activeElement?.blur();
  refresh();
});

async function deleteTopic(rids) {
  if (!confirm(`Delete ${rids.length} recordings under this topic (audio + notes)? This cannot be undone.`)) return;
  // sequential — the backend rewrites the shared combined note on each delete
  for (const rid of rids) await fetch(`/recordings/${rid}`, { method: 'DELETE' });
  labelsStale = true;
  document.activeElement?.blur();
  refresh();
}

// ---- tree right-click menu: study material (quiz/test/flashcards/cheat sheet) for the
// current selection, plus rename/delete when exactly one item is selected.
treeEl.addEventListener('contextmenu', e => {
  const el = e.target.closest('[data-kind]');
  if (!el) return;
  e.preventDefault();
  const key = el.dataset.k + '||' + el.dataset.name;
  if (!treeSel.has(key)) treeSel = new Set([key]); // outside selection: select just this
  applyTreeSel();
  openTreeMenu(e.clientX, e.clientY);
});
// click-away / scroll / Esc close the menu — permanent listeners, gated on menuEl so they're near-free when idle
document.addEventListener('click', e => { if (menuEl && !menuEl.contains(e.target)) closeTreeMenu(); });
document.addEventListener('scroll', () => { if (menuEl) closeTreeMenu(); }, true);
document.addEventListener('keydown', e => { if (menuEl && e.key === 'Escape') closeTreeMenu(); });

function closeTreeMenu() { menuEl?.remove(); menuEl = null; }

function openTreeMenu(x, y) {
  closeTreeMenu();
  // quiz/test carry the same mcq|frq choice the Practice builder offers, as flat items
  const items = [
    ['Quiz — MCQ', el => genStudy('quiz', el, 'mcq')],
    ['Quiz — FRQ', el => genStudy('quiz', el, 'frq')],
    ['Test — MCQ', el => genStudy('test', el, 'mcq')],
    ['Test — FRQ', el => genStudy('test', el, 'frq')],
    ['Flashcards', el => genStudy('flashcards', el)],
    ['Cheat sheet', el => genStudy('cheatsheet', el)],
  ];
  if (treeSel.size === 1) items.push(['Rename', renameSel], ['Delete', deleteSel]);
  menuEl = document.createElement('div');
  menuEl.className = 'tree-menu';
  menuEl.innerHTML = items.map((it, i) => `<div class="tree-menu-item" data-i="${i}">${esc(it[0])}</div>`).join('');
  document.body.appendChild(menuEl);
  const r = menuEl.getBoundingClientRect();
  menuEl.style.left = Math.max(4, Math.min(x, window.innerWidth - r.width - 4)) + 'px';
  menuEl.style.top = Math.max(4, Math.min(y, window.innerHeight - r.height - 4)) + 'px';
  menuEl.addEventListener('click', e => {
    const it = e.target.closest('[data-i]');
    if (it) items[+it.dataset.i][1](it);
  });
}

// Group the selection by class -> scopes. A selected unit is sent whole ({unit}),
// a selected topic narrows to it ({unit, topic}); backend dedupes overlap. The
// selection may span classes, so each class gets its own /study/generate call.
function studyByClass() {
  const m = new Map();  // "sem||cls" -> [scopes]
  for (const k of treeSel) {
    const [sem, cls, ...rest] = k.split('||');
    const sc = sem + '||' + cls;
    if (!m.has(sc)) m.set(sc, []);
    m.get(sc).push(rest.length > 1 ? { unit: rest[0], topic: rest[1] } : { unit: rest[0] });
  }
  return m;
}

async function genStudy(kind, itemEl, fmt = 'mcq') {
  if (genBusy) return;
  genBusy = true;
  itemEl.textContent = '…';
  try {
    const out = [];  // {cls, resp} per class that generated something
    for (const [sc, scopes] of studyByClass()) {
      const [sem, cls] = sc.split('||');
      const resp = await (await fetch('/study/generate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind, format: fmt, semester: sem, class: cls, scopes }),
      })).json();
      if (resp.error) { alert(`${cls}: ${resp.error}`); continue; }
      out.push({ cls, resp });
    }
    if (!out.length) return;
    if (kind === 'quiz' || kind === 'test') {
      pastLoaded = 0;               // the rest show up in the past-quizzes list
      renderQuizForm(out[0].resp);
    } else if (kind === 'flashcards') {
      alert(out.map(o => `${o.cls}: ${o.resp.count} cards`).join('\n'));
    } else {
      renderCheatsheets(out);       // in-app view; each is also filed to Obsidian
    }
  } finally { genBusy = false; closeTreeMenu(); }
}

// Cheat sheets get the full page width (#sheetArea, above .main) rather than the
// narrow sessions column — they're documents, with tables and diagrams that need
// the room. One card per class; the note is already filed under its Exam Prep.
function renderCheatsheets(list) {
  const area = document.getElementById('sheetArea');
  area.innerHTML = '';
  for (const { cls, resp } of list) {
    const card = document.createElement('div');
    card.className = 'quiz cheatsheet sheet';
    card.innerHTML = `<div class="quiz-head"><b>${esc(cls)}</b><span class="cs-actions">`
      + (resp.obsidian ? `<a href="${escAttr(resp.obsidian)}">Open in Obsidian</a>` : '')
      + `<button onclick="closeSheets()" title="Close">&#10005;</button>`
      + `</span></div>${md(resp.markdown)}`;
    const dl = document.createElement('button');
    dl.textContent = 'Download .md';
    dl.onclick = () => downloadMd(resp.markdown, resp.filename);
    const pr = document.createElement('button');
    pr.textContent = 'Print';       // a cheat sheet's whole point is being on paper
    pr.onclick = () => window.print();
    card.querySelector('.cs-actions').prepend(dl, pr);
    area.appendChild(card);
    typeset(card);  // formula LaTeX + the mermaid diagrams the sheet is built from
  }
  area.scrollIntoView({ behavior: 'smooth' });
}

function closeSheets() { document.getElementById('sheetArea').innerHTML = ''; }

function downloadMd(markdown, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([markdown], { type: 'text/markdown' }));
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function renameSel() {
  const [sem, cls, ...rest] = [...treeSel][0].split('||');
  closeTreeMenu();
  const isTopic = rest.length > 1;
  const oldName = rest.at(-1);
  const name = prompt('Rename to:', oldName);
  if (!name || name === oldName) return;
  const body = isTopic
    ? { semester: sem, class: cls, from_unit: rest[0], from_topic: rest[1], to_unit: rest[0], to_topic: name }
    : { semester: sem, class: cls, from_unit: rest[0], to_unit: name };
  fetch(isTopic ? '/merge_topics' : '/merge_units', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  }).then(r => r.json()).then(resp => {
    if (!resp.ok) { alert(resp.error || 'rename failed'); return; }
    treeSel.clear(); refresh();
  });
}

// reuses the existing per-row delete button (and its confirm) instead of duplicating that logic
function deleteSel() {
  const [sem, cls, ...rest] = [...treeSel][0].split('||');
  const name = rest.join('||');
  closeTreeMenu();
  const el = [...treeEl.querySelectorAll('[data-kind]')].find(x => x.dataset.k === sem + '||' + cls && x.dataset.name === name);
  el?.querySelector('.tree-del')?.click();
  treeSel.clear();
}

// ---- merge panel: units or topics — suggests near-duplicates, lets the user merge any two ----
let mergeLevel = 'unit';
function setMergeLevel(l) {
  mergeLevel = l;
  document.activeElement?.blur(); // toggle button holds focus in the panel — guard would skip the re-render
  refresh();
}
// Which two units/topics should be merged. Topic level scores the SUMMARIES, not
// the names: an intro lecture that touches a topic in passing and the lecture that
// covers it properly rarely share a title. Pure -- test_merge_opts.js drives it directly.
const MERGE_BAR = 0.5;   // containment below this isn't "highly suggested"
const MERGE_CAP = 4;     // suggest a few, or the panel is just the topic list again
const mergeWords = s => new Set(String(s || '').toLowerCase().split(/[^a-z0-9]+/)
  .filter(w => w.length >= 4).map(w => w.replace(/s$/, '')));

function mergeSuggestions(rows, level) {
  const groups = {};   // "sem||cls" -> { "unit" | "unit||topic" -> {title, text} }
  for (const r of rows) {
    if (r.status !== 'done' || !r.semester || !r.class || !r.unit) continue;
    if (level === 'topic' && !r.topic) continue;
    const g = (groups[r.semester + '||' + r.class] ??= {});
    const name = level === 'unit' ? r.unit : r.unit + '||' + r.topic;
    // per TOPIC, not per row: a topic spanning three recordings is one candidate
    // with three summaries behind it, not three copies of the same suggestion.
    (g[name] ??= { title: level === 'unit' ? r.unit : r.topic, text: '' }).text += ' ' + (r.summary || '');
  }
  const out = [];
  for (const [k, g] of Object.entries(groups)) {
    const names = Object.keys(g).sort();
    if (level === 'unit') {
      // Unit dupes are name forks ("Unit 3" / "Unit 3 Vectors"). Content says nothing
      // at this level -- every unit in a class shares the course's whole vocabulary.
      for (let i = 0; i < names.length; i++)
        for (let j = i + 1; j < names.length; j++)
          if ([...mergeWords(names[i])].some(w => mergeWords(names[j]).has(w)))
            out.push({ k, a: names[i], b: names[j] });
      continue;
    }
    const terms = {}, seen = {}, depth = {};
    for (const n of names) {
      terms[n] = mergeWords(g[n].text);
      depth[n] = terms[n].size;   // ground actually covered, measured BEFORE the trim below equalises the sets
      for (const w of terms[n]) seen[w] = (seen[w] || 0) + 1;
    }
    // Poor-man's IDF, trimmed at both ends. Above: a term in more than half this
    // class's topics is course vocabulary ("function", "example", "problem") and
    // drowns the signal. Below: a term only one topic
    // uses can never signal shared coverage, and leaving it in the denominator
    // penalises the intro for its own filler ("overview", "welcome") -- the exact
    // words that make a passing mention look unrelated to the lecture it belongs to.
    // The floor of 2 is because in a small class half the topics IS two, and those
    // are the very terms a pair shares.
    const common = Math.max(2, names.length / 2);
    for (const n of names) terms[n] = new Set([...terms[n]].filter(w => seen[w] >= 2 && seen[w] <= common));
    // ponytail: O(n^2) over one class's topics -- fine at a student's scale
    for (let i = 0; i < names.length; i++)
      for (let j = i + 1; j < names.length; j++) {
        // thinner coverage gets absorbed into the fuller one -- on raw breadth, since
        // trimming leaves both sides holding the same shared terms and no ordering at all
        const [a, b] = depth[names[i]] <= depth[names[j]] ? [names[i], names[j]] : [names[j], names[i]];
        const small = terms[a], big = terms[b];
        if (small.size < 3) continue;   // two or three coincident words are not a topic in common
        // containment, not Jaccard: an intro shares most of ITS OWN terms with the
        // deep lecture but few of the lecture's, so symmetric overlap scores that
        // pair near zero -- exactly the case this is meant to catch.
        let hit = 0;
        for (const w of small) if (big.has(w)) hit++;
        // A shared title word LOWERS the bar, it does not raise the score. Added to the
        // score it became the primary sort key -- content pairs bunch near 1.0, so every
        // rename-dupe outranked them and ate the cap the deep-coverage pairs are for.
        const sameName = [...mergeWords(g[a].title)].some(w => mergeWords(g[b].title).has(w));
        const score = hit / small.size;
        if (score >= (sameName ? 0.3 : MERGE_BAR)) out.push({ k, a, b, score, hit });
      }
  }
  return level === 'unit' ? out : out.sort((p, q) => q.score - p.score || q.hit - p.hit).slice(0, MERGE_CAP);
}

function renderMerge(rows) {
  const panel = document.getElementById('merge');
  if (document.activeElement && panel.contains(document.activeElement)) return; // mid-pick on the 5s tick
  const groups = {};   // "sem||cls" -> Set of unit names (unit level) or "unit||topic" composites (topic level, class-wide)
  for (const r of rows) {
    if (r.status !== 'done' || !r.semester || !r.class || !r.unit) continue;
    if (mergeLevel === 'unit') (groups[r.semester + '||' + r.class] ??= new Set()).add(r.unit);
    else if (r.topic) (groups[r.semester + '||' + r.class] ??= new Set()).add(r.unit + '||' + r.topic);
  }
  const dn = u => mergeLevel === 'topic' ? u.split('||').join(' / ') : u; // display: "unit / topic" or plain unit
  const sugg = mergeSuggestions(rows, mergeLevel);
  const opts = [];                        // every full key, for the manual selects
  for (const [k, set] of Object.entries(groups))
    for (const u of [...set].sort()) opts.push(k + '||' + u);
  const ctx = k => k.split('||').slice(1).join(' / ');  // context label without the semester
  // An option carries only its unit (/ topic); the class name -- long and identical
  // for every option under it -- rides on the optgroup label instead. A native
  // select clips rather than wraps, so shorter option text is the real fix.
  const nParts = mergeLevel === 'unit' ? 1 : 2;
  const byClass = {};
  for (const o of opts) (byClass[o.split('||').slice(0, -nParts).join('||')] ??= []).push(o);
  panel.hidden = false;
  panel.innerHTML = `
    <span class="deck-label">Merge</span>
    <div class="merge-level">
      <button class="${mergeLevel === 'unit' ? 'on' : ''}" onclick="setMergeLevel('unit')">Units</button>
      <button class="${mergeLevel === 'topic' ? 'on' : ''}" onclick="setMergeLevel('topic')">Topics</button>
    </div>
    ${opts.length < 2 ? `<p class="merge-hint">Nothing to merge — need two ${mergeLevel}s under the same class.</p>` : `
    ${sugg.length ? `<p class="merge-hint">${mergeLevel === 'unit' ? 'Possible duplicates:' : 'These cover the same material:'}</p>` : ''}
    ${sugg.map(s => `<div class="merge-sugg">
      <span><em>${esc(dn(s.a))}</em> &rarr; <em>${esc(dn(s.b))}</em><span class="merge-cls">${esc(ctx(s.k))}</span></span>
      <span class="merge-actions">
        <button data-k="${escAttr(s.k)}" data-from="${escAttr(s.a)}" data-to="${escAttr(s.b)}" title="Merge &ldquo;${escAttr(dn(s.a))}&rdquo; into &ldquo;${escAttr(dn(s.b))}&rdquo;">Merge</button>
        <button data-k="${escAttr(s.k)}" data-from="${escAttr(s.b)}" data-to="${escAttr(s.a)}" title="Merge &ldquo;${escAttr(dn(s.b))}&rdquo; into &ldquo;${escAttr(dn(s.a))}&rdquo;">Reverse</button>
      </span>
    </div>`).join('')}
    <div class="merge-manual">
      <select id="mergeFrom" onchange="mergeFromChanged()">${Object.entries(byClass).map(([g, os]) =>
        `<optgroup label="${escAttr(ctx(g))}">${os.map(o =>
          `<option value="${escAttr(o)}">${esc(o.split('||').slice(-nParts).join(' / '))}</option>`
        ).join('')}</optgroup>`).join('')}</select>
      <span class="merge-into">into</span>
      <select id="mergeTo"></select>
      <button onclick="manualMerge()">Merge</button>
    </div>`}`;
  if (opts.length >= 2) mergeFromChanged();
}

// delegated: apostrophes in unit names ("Newton's Laws") break inline onclick strings
document.getElementById('merge').addEventListener('click', e => {
  const b = e.target.closest('button[data-from]');
  if (b) doMerge(mergeLevel, b.dataset.k, b.dataset.from, b.dataset.to);
});

function mergeFromChanged() {
  const from = document.getElementById('mergeFrom').value;
  const n = mergeLevel === 'unit' ? 1 : 2;   // topic values carry an extra unit segment ("unit||topic")
  const scope = v => v.split('||').slice(0, -n).join('||');  // siblings share everything above this
  const name = v => v.split('||').slice(-n).join(' / ');
  const k = scope(from);
  const to = document.getElementById('mergeTo');
  to.innerHTML = [...document.getElementById('mergeFrom').options]
    .map(o => o.value).filter(v => v !== from && scope(v) === k)
    .map(v => `<option value="${escAttr(v)}">${esc(name(v))}</option>`).join('');
}

async function doMerge(level, k, from, to) {
  const [sem, cls] = k.split('||');   // k is always "sem||cls" now — class-scoped for both levels
  let body, msg;
  if (level === 'unit') {
    body = { semester: sem, class: cls, from_unit: from, to_unit: to };
    msg = `Merge unit "${from}" into "${to}" (${cls})? Notes move; the old unit folder is removed.`;
  } else {
    const [fu, ft] = from.split('||'), [tu, tt] = to.split('||');
    body = { semester: sem, class: cls, from_unit: fu, from_topic: ft, to_unit: tu, to_topic: tt };
    msg = ft === tt
      ? `Move topic "${ft}" from "${fu}" to "${tu}"?`
      : `Merge topic "${ft}" (${fu}) into "${tt}" (${tu})?`;
  }
  if (!confirm(msg)) return;
  const resp = await (await fetch(level === 'unit' ? '/merge_units' : '/merge_topics', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })).json();
  if (!resp.ok) alert(resp.error || 'merge failed');
  document.activeElement?.blur(); // clicked button holds focus in the panel — guard would skip the re-render
  await refresh();
}

function manualMerge() {
  const from = document.getElementById('mergeFrom').value;
  const to = document.getElementById('mergeTo').value;
  if (!to) return;
  const n = mergeLevel === 'unit' ? 1 : 2;
  const parts = from.split('||');
  doMerge(mergeLevel, parts.slice(0, -n).join('||'), parts.slice(-n).join('||'), to.split('||').slice(-n).join('||'));
}

const GS_KEYS = ['class_drop_min', 'class_drop_max', 'unit_drop_min', 'unit_drop_max', 'unit_hue_shift',
                 'topic_drop_min', 'topic_drop_max', 'topic_hue_shift'];

function gsVal(input) { input.nextElementSibling.textContent = input.value + '%'; }
function gsShowLevel() {

  for (const row of document.querySelectorAll('.gs-row'))

loadGraphSettings();

// ---- practice quizzes: selects + past list re-render on refresh (focus-guarded);
// ---- the quiz being taken lives in #quizArea, which refresh() never touches.
let quizRows = [];

// Fill a semester>class>unit cascade of <select>s from filed rows.
// Blank semester = all semesters; blank unit = whole class. Preserves current picks.
function fillScope(rows, semSel, clsSel, unitSel, hideExamUnits = false) {
  const done = rows.filter(r => r.status === 'done' && r.class);
  const uniq = arr => [...new Set(arr)].sort();
  const opt = (v, label) => `<option value="${escAttr(v)}">${esc(label ?? v)}</option>`;

  const sems = uniq(done.filter(r => r.semester).map(r => r.semester));
  const semCur = semSel.value;
  semSel.innerHTML = opt('', 'All semesters') + sems.map(s => opt(s)).join('');
  if (sems.includes(semCur)) semSel.value = semCur;

  const sem = semSel.value;
  const inSem = done.filter(r => !sem || r.semester === sem);
  const classes = uniq(inSem.map(r => r.class));
  const clsCur = clsSel.value;
  clsSel.innerHTML = classes.map(c => opt(c)).join('');
  if (classes.includes(clsCur)) clsSel.value = clsCur;

  const cls = clsSel.value;
  const units = uniq(inSem.filter(r => r.class === cls && r.unit).map(r => r.unit))
    .filter(u => !hideExamUnits || !/exam/i.test(u)); // quiz creator: exam/exam-prep units aren't study material
  unitSel.innerHTML = opt('', 'whole class') + units.map(u => opt(u)).join('');
}

function renderPractice(rows) {
  const card = document.getElementById('practice');
  if (document.activeElement && card.contains(document.activeElement)) return;
  quizRows = rows;
  fillScope(rows, document.getElementById('pSem'), document.getElementById('pClass'), document.getElementById('pUnit'), true);
  loadPastQuizzes();
  loadWeakSpots();
}
function pScope() {
  fillScope(quizRows, document.getElementById('pSem'), document.getElementById('pClass'), document.getElementById('pUnit'), true);
  weakLoaded = 0;  // scope changed — stale weak spots for the old class must not linger
  loadWeakSpots();
}

let pastLoaded = 0;
async function loadPastQuizzes() {
  if (Date.now() - pastLoaded < 30000) return; // past list barely changes — poll it gently
  pastLoaded = Date.now();
  const qs = await (await fetch('/quizzes')).json();
  // grouped by semester, in the order each one first appears — /quizzes comes
  // back newest-first, so the semester you're in heads the list without sorting
  const bySem = new Map();
  for (const q of qs) {
    const sem = q.semester || 'No semester';
    if (!bySem.has(sem)) bySem.set(sem, []);
    bySem.get(sem).push(q);
  }
  document.getElementById('pastQuizzes').innerHTML = [...bySem].map(([sem, list]) =>
    `<div class="pq-sem">${esc(sem)}</div>` + list.map(q => `
    <div class="pq-row" onclick="openQuiz('${q.id}')">
      <span>${esc(q.kind)} · ${esc(q.class || '')}${q.unit ? ' / ' + esc(q.unit) : ''}</span>
      <span class="pq-score">${q.score === null ? 'unfinished' : q.score + '%'} · ${(q.created_at || '').slice(0, 10)}</span>
    </div>`).join('')).join('');
}

let weakLoaded = 0;
let weakTopicsCache = [];
async function loadWeakSpots() {
  if (Date.now() - weakLoaded < 30000) return; // gentle poll, same cadence as loadPastQuizzes
  const cls = document.getElementById('pClass').value;
  const el = document.getElementById('weakSpots');
  if (!cls) { el.innerHTML = ''; weakTopicsCache = []; return; }
  weakLoaded = Date.now();
  const qs = new URLSearchParams({ class: cls });
  const sem = document.getElementById('pSem').value;
  if (sem) qs.set('semester', sem);
  const spots = await (await fetch('/weak_spots?' + qs)).json();
  weakTopicsCache = spots.map(s => s.topic);
  el.innerHTML = spots.length ? `<p class="gs-note">Weakest: ${
    spots.map(s => `${esc(s.topic)} (${s.missed}/${s.attempted})`).join(', ')
  } <button onclick="drillWeak(this)">Drill these</button></p>` : '';
}

async function drillWeak(btn) {
  const body = {
    semester: document.getElementById('pSem').value,
    class: document.getElementById('pClass').value,
    // no unit: weak spots aggregate class-wide, a unit filter can zero them out
    kind: 'quiz',
    format: document.getElementById('pFormat').value,
    topics: weakTopicsCache,
  };
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'generating…';
  try {
    const q = await (await fetch('/quiz/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })).json();
    if (q.error) { alert(q.error); return; }
    pastLoaded = 0;
    renderQuizForm(q);
  } finally { btn.disabled = false; btn.textContent = old; }
}

async function genQuiz(btn) {
  const body = {
    semester: document.getElementById('pSem').value,
    class: document.getElementById('pClass').value,
    unit: document.getElementById('pUnit').value,
    kind: document.getElementById('pKind').value,
    format: document.getElementById('pFormat').value,
  };
  if (!body.class) { alert('record and file some lectures first'); return; }
  btn.disabled = true; btn.textContent = 'generating…';
  try {
    const q = await (await fetch('/quiz/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })).json();
    if (q.error) { alert(q.error); return; }
    pastLoaded = 0;
    renderQuizForm(q);
  } finally { btn.disabled = false; btn.textContent = 'Generate'; document.activeElement?.blur(); }
}

function renderQuizForm(q) {
  const area = document.getElementById('quizArea');
  const head = `<div class="quiz-head"><b>${esc(q.kind)} — ${esc(q.class || '')}${q.unit ? ' / ' + esc(q.unit) : ''}</b>
      <button onclick="closeQuiz()" title="Close">&#10005;</button></div>`;
  if (q.questions[0]?.type === 'frq') {
    area.innerHTML = `<div class="quiz" data-qid="${q.id}">${head}
      ${q.questions.map((qq, i) => `<div class="q"><p>${i + 1}. ${esc(qq.q)}</p></div>`).join('')}
      <p class="gs-note">Write your answers on paper, then photograph/scan and upload.</p>
      <input type="file" id="frqFiles" multiple accept="image/*,.pdf" capture="environment">
      <button class="submit" onclick="submitFrq('${q.id}', this)">Submit</button>
    </div>`;
  } else {
    area.innerHTML = `<div class="quiz" data-qid="${q.id}">${head}
      ${q.questions.map((qq, i) => `<div class="q" data-i="${i}">
        <p>${i + 1}. ${esc(qq.q)}</p>
        ${qq.type === 'mcq'
          ? qq.choices.map((c, ci) => `<label><input type="radio" name="q${i}" value="${ci}"> ${esc(c)}</label>`).join('')
          : `<textarea rows="2" placeholder="your answer"></textarea>`}
      </div>`).join('')}
      <button class="submit" onclick="submitQuiz(this, '${q.id}')">Submit</button>
    </div>`;
  }
  area.scrollIntoView({ behavior: 'smooth' });
}

async function submitQuiz(btn, qid) {
  const quiz = document.querySelector(`.quiz[data-qid="${qid}"]`);
  const answers = [...quiz.querySelectorAll('.q')].map(div => {
    const r = div.querySelector('input[type="radio"]:checked');
    if (r) return +r.value;
    const t = div.querySelector('textarea');
    return t ? t.value : null;
  });
  btn.disabled = true; btn.textContent = 'grading…';
  try {
    const g = await (await fetch(`/quiz/${qid}/submit`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ answers }),
    })).json();
    pastLoaded = 0;
    renderQuizResults(qid, g.questions, g.results, g.score);
  } finally { btn.disabled = false; }
}

async function submitFrq(qid, btn) {
  const files = [...document.getElementById('frqFiles').files];
  if (!files.length) { alert('attach at least one photo/scan'); return; }
  btn.disabled = true; btn.textContent = 'grading…';
  try {
    const encoded = await Promise.all(files.map(f => new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve({ name: f.name, data: r.result.split(',')[1] });
      r.onerror = reject;
      r.readAsDataURL(f);
    })));
    const g = await (await fetch(`/quiz/${qid}/submit_frq`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: encoded }),
    })).json();
    if (g.error) { alert(g.error); return; }
    pastLoaded = 0;
    renderQuizResults(qid, g.questions, g.results, g.score);
  } finally { btn.disabled = false; }
}

function renderQuizResults(qid, questions, results, score) {
  document.getElementById('quizArea').innerHTML = `<div class="quiz" data-qid="${qid}">
    <div class="quiz-head"><b>Score: ${score}%</b>
      <button onclick="closeQuiz()" title="Close">&#10005;</button></div>
    ${questions.map((qq, i) => {
      const r = results[i] || {};
      let verdict;
      if (qq.type === 'mcq') {
        const ok = r.correct;
        verdict = `<p class="verdict ${ok ? 'good' : 'bad'}">${ok ? '✓ correct' :
          `✗ ${r.answer === null || r.answer === undefined || r.answer === '' ? 'skipped' : 'you picked: ' + esc(String(qq.choices[r.answer] ?? r.answer))} — answer: ${esc(String(qq.choices[qq.answer] ?? qq.answer))}`}
          ${qq.explanation ? '<br>' + esc(qq.explanation) : ''}</p>`;
      } else {
        const s = r.score ?? 0;
        const ref = qq.type === 'frq' ? `Rubric: ${esc(qq.rubric || '')}` : `Model answer: ${esc(qq.answer || '')}`;
        const mine = qq.type === 'frq' ? `Transcribed: ${esc(String(r.answer || '(blank)'))}` : `You wrote: ${esc(String(r.answer || '(blank)'))}`;
        verdict = `<p class="verdict ${s >= 1 ? 'good' : 'bad'}">${s >= 1 ? '✓' : s > 0 ? '½' : '✗'} ${esc(r.feedback || '')}
          <br>${ref}</p>
          <p class="verdict">${mine}</p>`;
      }
      return `<div class="q"><p>${i + 1}. ${esc(qq.q)}</p>${verdict}</div>`;
    }).join('')}
  </div>`;
}

async function openQuiz(qid) {
  const q = await (await fetch('/quiz/' + qid)).json();
  document.activeElement?.blur();
  if (q.answers) renderQuizResults(qid, q.questions, q.answers, q.score);
  else renderQuizForm(q);
  document.getElementById('quizArea').scrollIntoView({ behavior: 'smooth' });
}

function dlCheat() {

let reviewQueue = [];
async function startReview() {   // the cards themselves load on the click, not on the poll
  try { reviewQueue = await (await fetch('/cards/due')).json(); }
  catch { reviewQueue = []; }
  if (!Array.isArray(reviewQueue)) reviewQueue = [];

function showCard() {
  const area = document.getElementById('reviewArea');
  if (!reviewQueue.length) { area.innerHTML = '<div class="quiz"><b>Done reviewing.</b> <button onclick="closeReview()">✕</button></div>'; return; }
  const c = reviewQueue[0];
  area.innerHTML = `<div class="quiz" data-cid="${c.id}">
    <div class="quiz-head"><b>${esc(c.class || '')}${c.unit ? ' / ' + esc(c.unit) : ''}</b>
      <button onclick="closeReview()" title="Close">✕</button></div>
    <div class="q"><p>${esc(c.front)}</p>

function flipCard() {

async function gradeCard(grade) {

    await fetch(`/cards/${cid}/review`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ grade }),
    });
  } catch {}
  reviewQueue.shift(); showCard();
}
function closeReview() { document.getElementById('reviewArea').innerHTML = ''; reviewQueue = []; }

// refresh() is async but setInterval never waited for it: a slow tick (cold mermaid,
// a throttled background tab) overlapped the next one, and the second wipe detached the
// nodes the first was still writing into. Skip while hidden too -- rebuilding a list
// nobody is looking at only buys a stall at the moment the window comes back.
let refreshing = false;
// set by refresh() from the rows: fast polling only while something is actually
// moving. An idle tab left open all day is what turned the 5s tick into an egress bill.
let pollBusy = false;
let lastPoll = 0;
setInterval(async () => {
  if (refreshing || document.hidden) return;
  // 5s while work is in flight (progress bars, live transcript), 30s when idle —
  // nothing on an idle list changes except by a click, which refreshes on its own.
  if (Date.now() - lastPoll < (pollBusy ? 5000 : 30000)) return;
  refreshing = true;
  lastPoll = Date.now();
  try { await refresh(); } finally { refreshing = false; }
}, 5000);
// ...but don't leave up-to-5s-stale rows on screen the moment the window comes back,
// which is exactly the app-switching this guard exists for.
document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastPoll = Date.now(); refresh(); } });
lastPoll = Date.now();
refresh();
</script>
